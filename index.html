<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HChat</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #111;
      --panel2: #181818;
      --line: #292929;
      --line2: #3c3c3c;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --blue: #2f8cff;
      --blue2: #1769d6;
      --red: #ff4d5e;
      --green: #28c76f;
      --side: 360px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line2);
      border-radius: 8px;
      outline: 0;
      background: var(--panel2);
      color: var(--text);
      font-size: 16px;
    }

    input { height: 44px; padding: 0 12px; }
    textarea { min-height: 42px; max-height: 130px; resize: none; padding: 10px 12px; }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
    }

    [hidden] { display: none !important; }

    .app {
      display: grid;
      width: 100vw;
      height: 100dvh;
      grid-template-columns: var(--side) minmax(0, 1fr);
      overflow: hidden;
    }

    .side {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: #080808;
    }

    .top,
    .head {
      display: flex;
      min-height: 68px;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .top { justify-content: space-between; }

    .brand {
      overflow: hidden;
      font-size: 24px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border: 1px solid var(--line2);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-weight: 800;
    }

    .profile {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .avatar {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff4155, #fb2978 55%, #ff9a3d);
      color: white;
      font-weight: 800;
      text-transform: uppercase;
    }

    .profile strong,
    .roomName,
    .title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile span,
    .roomPreview,
    .title span {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profileActions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .link {
      border: 0;
      background: transparent;
      color: #ff7a92;
      font-size: 12px;
      font-weight: 800;
      padding: 0;
    }

    .search {
      width: auto;
      margin: 0 14px 10px;
    }

    .count {
      padding: 0 18px 8px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .rooms {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 12px;
    }

    .room {
      display: grid;
      width: 100%;
      grid-template-columns: 50px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 64px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
    }

    .room:hover,
    .room.active {
      background: var(--panel2);
    }

    .room .avatar {
      width: 46px;
      height: 46px;
    }

    .roomBadge {
      color: #ff7a92;
      font-size: 12px;
      font-weight: 800;
    }

    .main {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #020202;
    }

    .empty,
    .chat {
      height: 100%;
      min-height: 0;
    }

    .empty {
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .emptyInner {
      max-width: 360px;
    }

    .emptyIcon {
      display: grid;
      width: 86px;
      height: 86px;
      margin: 0 auto 14px;
      place-items: center;
      border: 2px solid var(--line2);
      border-radius: 999px;
      font-size: 34px;
      font-weight: 800;
    }

    .empty p {
      color: var(--muted);
      line-height: 1.45;
    }

    .chat {
      display: flex;
      flex-direction: column;
    }

    .back {
      display: none;
      font-size: 24px;
    }

    .title {
      min-width: 0;
      flex: 1;
    }

    .messages {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 18px clamp(12px, 4vw, 52px);
    }

    .welcome {
      margin: auto;
      color: var(--muted);
      text-align: center;
    }

    .row {
      display: flex;
      width: 100%;
    }

    .row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 620px);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border: 1px solid var(--line2);
      border-radius: 18px;
      background: var(--panel2);
      padding: 10px 13px;
      line-height: 1.4;
    }

    .mine .bubble {
      border-color: var(--blue2);
      background: var(--blue2);
    }

    .meta {
      display: block;
      margin-top: 6px;
      color: rgba(255, 255, 255, .65);
      font-size: 10px;
    }

    .mediaStack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .mediaItem {
      display: block;
      width: min(68vw, 380px);
      max-width: 100%;
      max-height: 430px;
      border-radius: 12px;
      background: black;
      object-fit: contain;
    }

    .composerWrap {
      flex: 0 0 auto;
      padding: 0 clamp(10px, 4vw, 36px) calc(12px + env(safe-area-inset-bottom));
    }

    .attachmentTray {
      display: flex;
      gap: 8px;
      max-width: 980px;
      margin: 0 auto 8px;
      overflow-x: auto;
    }

    .pending {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 220px;
      padding: 8px 10px;
      border: 1px solid var(--line2);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .pending span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pending button {
      border: 0;
      background: transparent;
      color: var(--red);
      font-weight: 900;
    }

    .composer {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) minmax(72px, auto);
      gap: 8px;
      align-items: end;
      max-width: 980px;
      margin: 0 auto;
      padding: 7px;
      border: 1px solid var(--line2);
      border-radius: 24px;
      background: #050505;
    }

    .composer textarea {
      min-width: 0;
    }

    .composer button {
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--blue);
      font-weight: 900;
    }

    .composer .send {
      min-width: 72px;
      padding: 0 14px;
      background: var(--blue);
      color: white;
    }

    .primary,
    .danger {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 800;
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .primary:hover { background: var(--blue2); }

    .danger {
      border: 1px solid rgba(255, 77, 94, .45);
      background: rgba(255, 77, 94, .08);
      color: #ff8b97;
    }

    .modalBg {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, .75);
    }

    .modal {
      position: relative;
      width: min(450px, 100%);
      max-height: calc(100dvh - 40px);
      overflow: auto;
      border: 1px solid var(--line2);
      border-radius: 10px;
      background: #151515;
      padding: 24px;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line2);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: 18px;
    }

    .modal form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #d1d5db;
      font-size: 12px;
      font-weight: 800;
    }

    .check {
      display: grid !important;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: start;
      color: var(--muted) !important;
      font-weight: 500 !important;
      line-height: 1.35;
    }

    .check input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--blue);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .error {
      color: #ff8b97;
      font-size: 12px;
      line-height: 1.35;
    }

    .emptyHistory {
      color: var(--muted);
      padding: 22px 10px;
      text-align: center;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      z-index: 20;
      right: 18px;
      bottom: 18px;
      max-width: min(520px, calc(100vw - 28px));
      border: 1px solid var(--line2);
      border-radius: 8px;
      background: #262626;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 760px) {
      .app {
        display: block;
        position: relative;
      }

      .side,
      .main {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: transform .2s ease;
      }

      .main {
        transform: translateX(100%);
        background: #020202;
      }

      .app.open .side {
        transform: translateX(-18%);
      }

      .app.open .main {
        transform: translateX(0);
      }

      .back { display: grid; }
      .empty { display: none; }

      .top,
      .head {
        min-height: calc(58px + env(safe-area-inset-top));
        padding-top: env(safe-area-inset-top);
      }

      .bubble {
        max-width: 88%;
        font-size: 14px;
      }

      .messages {
        padding: 12px 10px;
      }

      .composerWrap {
        padding-right: 6px;
        padding-left: 6px;
      }

      .modalBg {
        align-items: end;
        padding: env(safe-area-inset-top) 0 0;
      }

      .modal {
        width: 100%;
        max-height: calc(100dvh - env(safe-area-inset-top));
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        border-radius: 12px 12px 0 0;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }

      .toast {
        right: 12px;
        bottom: 12px;
        left: 12px;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="side">
      <header class="top">
        <div class="brand">HChat</div>
        <button class="icon" id="newRoom" type="button" aria-label="Criar sala">+</button>
      </header>

      <div class="profile">
        <div class="avatar" id="meAvatar">?</div>
        <div>
          <strong id="meName">Visitante</strong>
          <span id="status">Conectando...</span>
        </div>
        <div class="profileActions">
          <button class="link" id="logout" type="button" hidden>Sair</button>
        </div>
      </div>

      <input class="search" id="search" placeholder="Pesquisar salas" autocomplete="off">
      <div class="count" id="count">0 salas</div>
      <div class="rooms" id="rooms"></div>
    </aside>

    <main class="main">
      <section class="empty" id="empty">
        <div class="emptyInner">
          <div class="emptyIcon">HC</div>
          <h1>Suas conversas</h1>
          <p>Escolha uma sala ou crie uma nova para conversar.</p>
          <button class="primary" id="emptyNewRoom" type="button">Criar sala</button>
        </div>
      </section>

      <section class="chat" id="chatView" hidden>
        <header class="head">
          <button class="icon back" id="back" type="button" aria-label="Voltar">&lt;</button>
          <div class="avatar" id="roomAvatar">?</div>
          <div class="title">
            <strong id="roomTitle">Sala</strong>
            <span>Sala liberada</span>
          </div>
          <button class="icon" id="editRoom" type="button" aria-label="Editar sala">...</button>
        </header>

        <div class="messages" id="messages"></div>

        <div class="composerWrap">
          <div class="attachmentTray" id="attachmentTray" hidden></div>
          <form class="composer" id="msgForm">
            <button id="mediaButton" type="button" aria-label="Anexar arquivo">+</button>
            <textarea id="msgInput" rows="1" maxlength="2000" placeholder="Mensagem..." autocomplete="off"></textarea>
            <button class="send" id="sendMessage" type="submit" aria-label="Enviar">Enviar</button>
            <input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div class="modalBg" id="modalBg" hidden>
    <section class="modal" id="unlockModal" hidden>
      <button class="close" data-close type="button">x</button>
      <h2 id="unlockTitle">Entrar na sala</h2>
      <p>Digite seu nome e a senha da sala.</p>
      <form id="unlockForm">
        <label>Seu nome<input id="nameInput" minlength="2" maxlength="32" required></label>
        <label>Senha da sala<input id="passInput" type="password" required></label>
        <label class="check"><input id="locationConsent" type="checkbox" checked><span>Salvar.</span></label>
        <div class="error" id="unlockError"></div>
        <button class="primary" type="submit">Entrar</button>
      </form>
    </section>

    <section class="modal" id="roomModal" hidden>
      <button class="close" data-close type="button">x</button>
      <h2 id="roomModalTitle">Criar sala</h2>
      <p>Descricao e opcional. Ao editar, deixe a senha vazia para manter.</p>
      <form id="roomForm">
        <label>Nome da sala<input id="roomName" minlength="2" maxlength="40" required></label>
        <label>Descricao opcional<input id="roomDesc" maxlength="90" placeholder="Pode deixar em branco"></label>
        <label>Senha da sala<input id="roomPass" type="password" minlength="3" maxlength="128"></label>
        <div class="error" id="roomError"></div>
        <div class="actions">
          <button class="danger" id="clearMessages" type="button">Limpar historico</button>
          <button class="primary" type="submit">Salvar</button>
        </div>
      </form>
    </section>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    "use strict";

    const SUPABASE_URL = "https://xpfzqbjyizftllasvbll.supabase.co";
    const SUPABASE_KEY = "sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU";
    const USER_KEY = "hc_user_v5";
    const UNLOCK_KEY = "hc_unlocked_v5";
    const LOGIN_KEY = "hc_login_v5";
    const GEO_CONSENT_KEY = "hc_geo_consent_v2";
    const LOCATION_SAVE_RPC = "hot_chat_salvar_localizacao";
    const LOCATION_SAVE_RPC_OLD = "salvar_localizacao_mensagem";
    const MEDIA_BUCKET = "hot-chat-media";
    const MEDIA_PREFIX = "__HC_MEDIA_V1__:";
    const MAX_MEDIA_BYTES = 50 * 1024 * 1024;
    const POLL_MS = 1500;
    const LOGIN_TTL = 6 * 60 * 60 * 1000;

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    const e = {
      app: $("app"),
      rooms: $("rooms"),
      count: $("count"),
      search: $("search"),
      status: $("status"),
      meName: $("meName"),
      meAvatar: $("meAvatar"),
      logout: $("logout"),
      empty: $("empty"),
      chat: $("chatView"),
      roomTitle: $("roomTitle"),
      roomAvatar: $("roomAvatar"),
      messages: $("messages"),
      msgForm: $("msgForm"),
      msgInput: $("msgInput"),
      mediaButton: $("mediaButton"),
      mediaInput: $("mediaInput"),
      attachmentTray: $("attachmentTray"),
      sendMessage: $("sendMessage"),
      modalBg: $("modalBg"),
      unlockModal: $("unlockModal"),
      unlockTitle: $("unlockTitle"),
      unlockForm: $("unlockForm"),
      nameInput: $("nameInput"),
      passInput: $("passInput"),
      locationConsent: $("locationConsent"),
      unlockError: $("unlockError"),
      roomModal: $("roomModal"),
      roomModalTitle: $("roomModalTitle"),
      roomForm: $("roomForm"),
      roomName: $("roomName"),
      roomDesc: $("roomDesc"),
      roomPass: $("roomPass"),
      roomError: $("roomError"),
      clearMessages: $("clearMessages"),
      toast: $("toast")
    };

    let salas = [];
    let mensagens = [];
    let currentRoomId = null;
    let roomToUnlock = null;
    let editingRoomId = null;
    let pendingMedia = [];
    let salasHasDescricao = true;
    let loading = false;
    let toastTimer = null;
    let renderedRoomId = null;
    let renderedKey = "";

    function toast(text) {
      clearTimeout(toastTimer);
      e.toast.textContent = text;
      e.toast.hidden = false;
      toastTimer = setTimeout(() => e.toast.hidden = true, 5000);
    }

    function missingColumn(err, column) {
      const msg = String(err?.message || "");
      return new RegExp(column, "i").test(msg) && /schema cache|column|could not find/i.test(msg);
    }

    function functionMissing(err) {
      return /function|schema cache|not found|does not exist|404/i.test(String(err?.message || err || ""));
    }

    function initials(value) {
      const parts = String(value || "?").trim().split(/\s+/).filter(Boolean);
      const text = parts.length > 1 ? parts[0][0] + parts[1][0] : (parts[0] || "?").slice(0, 2);
      return text.toUpperCase();
    }

    function randomId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function formatBytes(bytes) {
      const size = Number(bytes) || 0;
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

    function cleanFileName(name) {
      return String(name || "media")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w.-]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(-90) || "media";
    }

    function isUnlocked(id) {
      try {
        return (JSON.parse(localStorage.getItem(UNLOCK_KEY)) || []).includes(id);
      } catch {
        return false;
      }
    }

    function setUnlocked(list) {
      localStorage.setItem(UNLOCK_KEY, JSON.stringify([...new Set(list)]));
    }

    function unlockRoom(id) {
      let list = [];
      try { list = JSON.parse(localStorage.getItem(UNLOCK_KEY)) || []; } catch {}
      list.push(id);
      setUnlocked(list);
    }

    function lockRoom(id) {
      let list = [];
      try { list = JSON.parse(localStorage.getItem(UNLOCK_KEY)) || []; } catch {}
      setUnlocked(list.filter(item => item !== id));
    }

    function getUser() {
      return localStorage.getItem(USER_KEY) || "";
    }

    function setUser(name) {
      localStorage.setItem(USER_KEY, name);
      e.meName.textContent = name || "Visitante";
      e.meAvatar.textContent = initials(name || "Visitante");
      e.logout.hidden = !name;
    }

    function hasGeoConsent() {
      const saved = localStorage.getItem(GEO_CONSENT_KEY);
      return saved === null ? true : saved === "1";
    }

    function setGeoConsent(value) {
      localStorage.setItem(GEO_CONSENT_KEY, value ? "1" : "0");
    }

    function roomById(id) {
      return salas.find(sala => sala.id === id);
    }

    function roomMessages(id) {
      return mensagens.filter(msg => msg.sala_id === id);
    }

    function normalizeSala(row) {
      return {
        id: row.id,
        nome: row.nome || row.name || "Sala",
        senha: row.senha || row.password || "",
        descricao: row.descricao || row.description || ""
      };
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(String(url || ""), window.location.href);
        return ["http:", "https:", "data:"].includes(parsed.protocol);
      } catch {
        return false;
      }
    }

    function normalizeMediaItem(item) {
      if (!item || !safeUrl(item.url)) return null;
      const mime = String(item.mime || "");
      const type = String(item.type || "").startsWith("video") || mime.startsWith("video/") ? "video" : "image";
      return {
        type,
        url: String(item.url),
        path: String(item.path || ""),
        name: String(item.name || (type === "video" ? "Video" : "Imagem")),
        mime,
        size: Number(item.size) || 0
      };
    }

    function parseMessageContent(value) {
      const raw = String(value || "");
      if (!raw.startsWith(MEDIA_PREFIX)) return { texto: raw, media: [] };
      try {
        const payload = JSON.parse(raw.slice(MEDIA_PREFIX.length));
        const media = Array.isArray(payload.items) ? payload.items.map(normalizeMediaItem).filter(Boolean) : [];
        return { texto: String(payload.text || ""), media };
      } catch {
        return { texto: raw, media: [] };
      }
    }

    function buildMediaPayload(text, items) {
      return `${MEDIA_PREFIX}${JSON.stringify({ text, items })}`;
    }

    function normalizeMsg(row) {
      const content = parseMessageContent(row.texto || row.text || "");
      return {
        id: row.id,
        sala_id: row.sala_id || row.room_id,
        usuario: row.usuario || row.author || "Visitante",
        texto: content.texto,
        media: content.media,
        criado_em: row.criado_em || row.created_at || new Date().toISOString()
      };
    }

    function messagePreview(msg) {
      if (msg.media?.length && msg.texto) return `${msg.texto} (${msg.media.length} anexo)`;
      if (msg.media?.length) return `${msg.media.length} anexo`;
      return msg.texto || "";
    }

    function renderRooms() {
      const q = e.search.value.trim().toLowerCase();
      const list = salas.filter(sala => `${sala.nome} ${sala.descricao}`.toLowerCase().includes(q));
      e.count.textContent = `${salas.length} ${salas.length === 1 ? "sala" : "salas"}`;
      e.rooms.replaceChildren();

      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "emptyHistory";
        empty.textContent = "Nenhuma sala encontrada.";
        e.rooms.append(empty);
        return;
      }

      for (const sala of list) {
        const msgs = roomMessages(sala.id);
        const last = msgs[msgs.length - 1];
        const unlocked = isUnlocked(sala.id);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `room${currentRoomId === sala.id ? " active" : ""}`;

        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.textContent = initials(sala.nome);

        const body = document.createElement("span");
        const name = document.createElement("span");
        name.className = "roomName";
        name.textContent = sala.nome;
        const prev = document.createElement("span");
        prev.className = "roomPreview";
        prev.textContent = unlocked ? (last ? `${last.usuario}: ${messagePreview(last)}` : "Nenhuma mensagem ainda") : (sala.descricao || "Toque para entrar");
        body.append(name, prev);

        const badge = document.createElement("span");
        badge.className = "roomBadge";
        badge.textContent = unlocked ? "aberta" : "senha";

        btn.append(avatar, body, badge);
        btn.onclick = () => selectRoom(sala.id);
        e.rooms.append(btn);
      }
    }

    function createMediaElement(item) {
      const link = document.createElement("a");
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener";

      const media = document.createElement(item.type === "video" ? "video" : "img");
      media.className = "mediaItem";
      media.src = item.url;
      if (item.type === "video") {
        media.controls = true;
        media.playsInline = true;
        media.preload = "metadata";
      } else {
        media.alt = item.name || "Imagem";
        media.loading = "lazy";
      }
      link.append(media);
      return link;
    }

    function messagesKey(id) {
      return roomMessages(id).map(msg => `${msg.id}|${msg.usuario}|${msg.texto}|${msg.criado_em}|${msg.media.length}`).join(";");
    }

    function renderMessages(force = false) {
      const sala = roomById(currentRoomId);
      if (!sala) return;

      const key = messagesKey(sala.id);
      if (!force && renderedRoomId === sala.id && renderedKey === key) return;

      const msgs = roomMessages(sala.id);
      const user = getUser() || "Visitante";
      const nearBottom = e.messages.scrollHeight - e.messages.scrollTop - e.messages.clientHeight < 120;

      e.messages.replaceChildren();

      if (!msgs.length) {
        const welcome = document.createElement("div");
        welcome.className = "welcome";
        welcome.innerHTML = `<div class="avatar" style="width:76px;height:76px;margin:0 auto 12px">${initials(sala.nome)}</div>`;
        const strong = document.createElement("strong");
        strong.textContent = sala.nome;
        const p = document.createElement("p");
        p.textContent = sala.descricao || "Envie a primeira mensagem.";
        welcome.append(strong, p);
        e.messages.append(welcome);
        renderedRoomId = sala.id;
        renderedKey = key;
        return;
      }

      for (const msg of msgs) {
        const row = document.createElement("div");
        row.className = `row${msg.usuario === user ? " mine" : ""}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (msg.media.length) {
          const stack = document.createElement("div");
          stack.className = "mediaStack";
          msg.media.forEach(item => stack.append(createMediaElement(item)));
          bubble.append(stack);
        }

        if (msg.texto) {
          const text = document.createElement("div");
          text.textContent = msg.texto;
          bubble.append(text);
        }

        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `${msg.usuario} - ${new Date(msg.criado_em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
        bubble.append(meta);
        row.append(bubble);
        e.messages.append(row);
      }

      renderedRoomId = sala.id;
      renderedKey = key;
      requestAnimationFrame(() => {
        if (nearBottom || force) e.messages.scrollTop = e.messages.scrollHeight;
      });
    }

    function resizeInput() {
      e.msgInput.style.height = "auto";
      e.msgInput.style.height = `${Math.min(Math.max(e.msgInput.scrollHeight, 42), 130)}px`;
    }

    function openModal(modal) {
      e.modalBg.hidden = false;
      e.unlockModal.hidden = modal !== e.unlockModal;
      e.roomModal.hidden = modal !== e.roomModal;
    }

    function closeModal() {
      e.modalBg.hidden = true;
      e.unlockModal.hidden = true;
      e.roomModal.hidden = true;
    }

    function openRoomModal(id = null) {
      editingRoomId = id;
      const sala = roomById(id);
      e.roomModalTitle.textContent = sala ? "Editar sala" : "Criar sala";
      e.roomName.value = sala?.nome || "";
      e.roomDesc.value = sala?.descricao || "";
      e.roomPass.value = "";
      e.roomPass.required = !sala;
      e.roomPass.placeholder = sala ? "Deixe em branco para manter" : "Senha para entrar";
      e.clearMessages.hidden = !sala;
      e.roomError.textContent = "";
      openModal(e.roomModal);
      setTimeout(() => e.roomName.focus(), 30);
    }

    function selectRoom(id) {
      const sala = roomById(id);
      if (!sala) return;

      if (!isUnlocked(id)) {
        roomToUnlock = sala;
        e.unlockTitle.textContent = `Entrar em ${sala.nome}`;
        e.nameInput.value = getUser();
        e.passInput.value = "";
        e.locationConsent.checked = hasGeoConsent();
        e.unlockError.textContent = "";
        openModal(e.unlockModal);
        setTimeout(() => (e.nameInput.value ? e.passInput : e.nameInput).focus(), 30);
        return;
      }

      currentRoomId = id;
      e.empty.hidden = true;
      e.chat.hidden = false;
      e.app.classList.add("open");
      e.roomTitle.textContent = sala.nome;
      e.roomAvatar.textContent = initials(sala.nome);
      renderRooms();
      renderMessages(true);
      resizeInput();
      setTimeout(() => e.msgInput.focus(), 30);
    }

    function closeChat() {
      currentRoomId = null;
      renderedRoomId = null;
      renderedKey = "";
      e.chat.hidden = true;
      e.empty.hidden = false;
      e.app.classList.remove("open");
      renderRooms();
    }

    async function insertSala(sala) {
      const payload = { nome: sala.nome, senha: sala.senha };
      if (salasHasDescricao) payload.descricao = sala.descricao || null;
      let result = await supabaseClient.from("salas").insert([payload]).select("*").single();
      if (result.error && missingColumn(result.error, "descricao")) {
        salasHasDescricao = false;
        delete payload.descricao;
        result = await supabaseClient.from("salas").insert([payload]).select("*").single();
      }
      if (result.error) throw result.error;
      return normalizeSala(result.data);
    }

    async function updateSala(sala, senha) {
      const payload = { nome: sala.nome };
      if (senha) payload.senha = senha;
      if (salasHasDescricao) payload.descricao = sala.descricao || null;
      let result = await supabaseClient.from("salas").update(payload).eq("id", sala.id);
      if (result.error && missingColumn(result.error, "descricao")) {
        salasHasDescricao = false;
        delete payload.descricao;
        result = await supabaseClient.from("salas").update(payload).eq("id", sala.id);
      }
      if (result.error) throw result.error;
    }

    async function loadData() {
      if (loading) return;
      loading = true;
      try {
        const sr = await supabaseClient.from("salas").select("*").order("criado_em", { ascending: true });
        if (sr.error) throw sr.error;

        if (!sr.data.length) {
          await insertSala({ nome: "Geral", senha: "a1234", descricao: "Conversa principal" });
          loading = false;
          await loadData();
          return;
        }

        const mr = await supabaseClient.from("mensagens").select("*").order("criado_em", { ascending: true });
        if (mr.error) throw mr.error;

        salas = sr.data.map(normalizeSala);
        const ids = new Set(salas.map(sala => sala.id));
        mensagens = (mr.data || []).map(normalizeMsg).filter(msg => ids.has(msg.sala_id));

        e.status.textContent = "Conectado ao Supabase";
        renderRooms();
        if (currentRoomId && roomById(currentRoomId)) renderMessages();
        if (currentRoomId && !roomById(currentRoomId)) closeChat();
      } catch (err) {
        console.error(err);
        e.status.textContent = "Erro no Supabase";
        toast(err.message || "Erro ao carregar dados.");
      } finally {
        loading = false;
      }
    }

    function getOptionalLocation() {
      if (!hasGeoConsent() || !navigator.geolocation) return Promise.resolve(null);
      return new Promise(resolve => {
        navigator.geolocation.getCurrentPosition(
          position => resolve({
            latitude: Number(position.coords.latitude.toFixed(6)),
            longitude: Number(position.coords.longitude.toFixed(6)),
            accuracy: Math.round(position.coords.accuracy || 0)
          }),
          () => resolve(null),
          { enableHighAccuracy: false, timeout: 6000, maximumAge: 10 * 60 * 1000 }
        );
      });
    }

    async function saveMessageLocation(messageId, roomId) {
      if (!messageId || !hasGeoConsent()) return;
      const location = await getOptionalLocation();

      const args = {
        p_mensagem_id: messageId,
        p_sala_id: roomId,
        p_usuario: getUser() || "Visitante",
        p_latitude: location?.latitude ?? null,
        p_longitude: location?.longitude ?? null,
        p_accuracy: location?.accuracy ?? null,
        p_timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
        p_language: navigator.language || "",
        p_user_agent: navigator.userAgent || ""
      };

      let result = await supabaseClient.rpc(LOCATION_SAVE_RPC, args);
      if (result.error && functionMissing(result.error)) result = await supabaseClient.rpc(LOCATION_SAVE_RPC_OLD, args);
      if (result.error) console.warn("Localizacao nao salva.", result.error);
    }

    function storagePathFor(file) {
      return `${cleanFileName(currentRoomId || "geral")}/${Date.now()}-${randomId()}-${cleanFileName(file.name)}`;
    }

    async function uploadPendingMedia() {
      const uploaded = [];
      for (const item of pendingMedia) {
        if (item.file.size > MAX_MEDIA_BYTES) throw new Error(`${item.file.name} tem ${formatBytes(item.file.size)}. Limite: ${formatBytes(MAX_MEDIA_BYTES)}.`);
        const path = storagePathFor(item.file);
        const result = await supabaseClient.storage.from(MEDIA_BUCKET).upload(path, item.file, {
          cacheControl: "3600",
          contentType: item.file.type || "application/octet-stream",
          upsert: false
        });
        if (result.error) throw result.error;
        const url = supabaseClient.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
        uploaded.push({
          type: item.file.type.startsWith("video/") ? "video" : "image",
          url,
          path,
          name: item.file.name,
          mime: item.file.type,
          size: item.file.size
        });
      }
      return uploaded;
    }

    function renderPendingMedia() {
      e.attachmentTray.replaceChildren();
      e.attachmentTray.hidden = pendingMedia.length === 0;
      for (const item of pendingMedia) {
        const wrap = document.createElement("span");
        wrap.className = "pending";
        const text = document.createElement("span");
        text.textContent = `${item.file.name} (${formatBytes(item.file.size)})`;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "x";
        remove.onclick = () => {
          pendingMedia = pendingMedia.filter(file => file.id !== item.id);
          renderPendingMedia();
        };
        wrap.append(text, remove);
        e.attachmentTray.append(wrap);
      }
    }

    function clearPendingMedia() {
      pendingMedia = [];
      e.mediaInput.value = "";
      renderPendingMedia();
    }

    function mediaPathsFromRows(rows) {
      const paths = [];
      for (const row of rows || []) {
        const content = parseMessageContent(row.texto || row.text || "");
        for (const item of content.media) if (item.path) paths.push(item.path);
      }
      return [...new Set(paths)];
    }

    async function removeMediaFromRows(rows) {
      const paths = mediaPathsFromRows(rows);
      for (let i = 0; i < paths.length; i += 100) {
        const chunk = paths.slice(i, i + 100);
        if (chunk.length) {
          const result = await supabaseClient.storage.from(MEDIA_BUCKET).remove(chunk);
          if (result.error) throw result.error;
        }
      }
    }

    $("newRoom").onclick = () => openRoomModal();
    $("emptyNewRoom").onclick = () => openRoomModal();
    $("back").onclick = closeChat;
    $("editRoom").onclick = () => currentRoomId && openRoomModal(currentRoomId);
    e.search.oninput = renderRooms;
    e.msgInput.oninput = resizeInput;

    e.modalBg.onclick = (event) => {
      if (event.target === e.modalBg || event.target.closest("[data-close]")) closeModal();
    };

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    e.logout.onclick = () => {
      localStorage.removeItem(LOGIN_KEY);
      localStorage.removeItem(USER_KEY);
      localStorage.removeItem(UNLOCK_KEY);
      setUser("");
      closeChat();
      toast("Sessao encerrada.");
    };

    e.unlockForm.onsubmit = (event) => {
      event.preventDefault();
      if (!roomToUnlock) return;
      if (e.passInput.value !== roomToUnlock.senha) {
        e.unlockError.textContent = "Senha da sala incorreta.";
        e.passInput.select();
        return;
      }
      setUser(e.nameInput.value.trim());
      setGeoConsent(e.locationConsent.checked);
      localStorage.setItem(LOGIN_KEY, String(Date.now()));
      unlockRoom(roomToUnlock.id);
      const id = roomToUnlock.id;
      roomToUnlock = null;
      closeModal();
      selectRoom(id);
    };

    e.roomForm.onsubmit = async (event) => {
      event.preventDefault();
      const nome = e.roomName.value.trim();
      const descricao = e.roomDesc.value.trim();
      const senha = e.roomPass.value;
      if (!nome) return;
      e.roomError.textContent = "";

      try {
        if (editingRoomId) {
          const sala = roomById(editingRoomId);
          await updateSala({ ...sala, nome, descricao }, senha);
          if (senha) lockRoom(sala.id);
          closeModal();
          await loadData();
          if (senha && currentRoomId === sala.id) closeChat();
          toast("Sala atualizada.");
          return;
        }

        if (senha.length < 3) {
          e.roomError.textContent = "Informe uma senha com pelo menos 3 caracteres.";
          return;
        }

        const created = await insertSala({ nome, descricao, senha });
        closeModal();
        await loadData();
        toast("Sala criada.");
        unlockRoom(created.id);
        selectRoom(created.id);
      } catch (err) {
        console.error(err);
        e.roomError.textContent = err.message || "Erro ao salvar sala.";
      }
    };

    e.clearMessages.onclick = async () => {
      const sala = roomById(editingRoomId);
      if (!sala || !confirm(`Limpar somente o historico da sala "${sala.nome}"? A sala vai continuar existindo.`)) return;
      try {
        const rows = await supabaseClient.from("mensagens").select("*").eq("sala_id", sala.id);
        if (rows.error) throw rows.error;
        await removeMediaFromRows(rows.data || []);
        const result = await supabaseClient.from("mensagens").delete().eq("sala_id", sala.id);
        if (result.error) throw result.error;
        closeModal();
        await loadData();
        toast("Historico limpo. A sala foi mantida.");
      } catch (err) {
        console.error(err);
        e.roomError.textContent = err.message || "Erro ao limpar historico.";
      }
    };

    e.mediaButton.onclick = () => {
      if (!currentRoomId) return;
      e.mediaInput.click();
    };

    e.mediaInput.onchange = () => {
      const files = Array.from(e.mediaInput.files || []);
      for (const file of files) {
        if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
          toast("Apenas imagens e videos sao aceitos.");
          continue;
        }
        pendingMedia.push({ id: randomId(), file });
      }
      renderPendingMedia();
      e.mediaInput.value = "";
    };

    e.msgForm.onsubmit = async (event) => {
      event.preventDefault();
      const text = e.msgInput.value.trim();
      if (!currentRoomId || (!text && !pendingMedia.length)) return;
      e.msgInput.disabled = true;
      e.sendMessage.disabled = true;
      e.mediaButton.disabled = true;

      let uploaded = [];
      try {
        if (pendingMedia.length) {
          toast(`Subindo ${pendingMedia.length} ${pendingMedia.length === 1 ? "anexo" : "anexos"}...`);
          uploaded = await uploadPendingMedia();
        }

        const body = uploaded.length ? buildMediaPayload(text, uploaded) : text;
        const result = await supabaseClient
          .from("mensagens")
          .insert([{ sala_id: currentRoomId, usuario: getUser() || "Visitante", texto: body }])
          .select("id")
          .single();

        if (result.error) throw result.error;
        e.msgInput.value = "";
        clearPendingMedia();
        resizeInput();
        await saveMessageLocation(result.data?.id, currentRoomId);
        await loadData();
        e.messages.scrollTop = e.messages.scrollHeight;
      } catch (err) {
        console.error(err);
        if (uploaded.length) await supabaseClient.storage.from(MEDIA_BUCKET).remove(uploaded.map(item => item.path)).catch(() => {});
        toast(err.message || "Erro ao enviar mensagem.");
      } finally {
        e.msgInput.disabled = false;
        e.sendMessage.disabled = false;
        e.mediaButton.disabled = false;
        e.msgInput.focus();
      }
    };

    e.msgInput.onkeydown = (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        e.msgForm.requestSubmit();
      }
    };

    setUser(getUser());
    if (Date.now() - Number(localStorage.getItem(LOGIN_KEY) || 0) > LOGIN_TTL) localStorage.removeItem(UNLOCK_KEY);
    resizeInput();
    loadData();
    setInterval(loadData, POLL_MS);
  </script>
</body>
</html>
