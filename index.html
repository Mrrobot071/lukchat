<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LChat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
    linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
    );

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    padding:15px;
}

/* SCROLL */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}

/* LOGIN */

.login{
    width:100%;
    max-width:380px;

    background:
    rgba(17,24,39,.96);

    backdrop-filter:blur(10px);

    padding:30px;

    border-radius:24px;

    border:1px solid #334155;

    display:flex;
    flex-direction:column;
    gap:16px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.45);
}

.login h2{
    text-align:center;
    font-size:24px;
    font-weight:700;
}

.login input{
    width:100%;

    padding:16px;

    border:none;

    border-radius:14px;

    background:#0f172a;

    color:white;

    outline:none;

    border:1px solid #334155;

    font-size:15px;

    transition:.2s;
}

.login input:focus{
    border-color:#2563eb;
}

.login button{
    width:100%;

    padding:16px;

    border:none;

    border-radius:14px;

    background:#2563eb;

    color:white;

    cursor:pointer;

    font-weight:bold;

    font-size:15px;

    transition:.2s;
}

.login button:hover{
    transform:scale(1.02);
}

/* CHAT */

.chat-container{
    width:100%;
    max-width:560px;

    height:95vh;

    background:
    rgba(17,24,39,.96);

    backdrop-filter:blur(10px);

    border-radius:24px;

    overflow:hidden;

    display:none;

    flex-direction:column;

    border:1px solid #334155;

    box-shadow:
    0 20px 60px rgba(0,0,0,.45);
}

/* TOPO */

.topo{
    background:#1e293b;

    padding:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:
    1px solid #334155;
}

.topo h2{
    font-size:18px;
    font-weight:700;
}

.online{
    font-size:12px;
    color:#22c55e;
    margin-top:4px;
}

/* CHAT AREA */

#chat{
    flex:1;

    overflow-y:auto;

    padding:16px;

    display:flex;

    flex-direction:column;

    gap:12px;

    scroll-behavior:smooth;
}

/* MSG */

.msg{
    max-width:80%;

    padding:12px 14px;

    border-radius:18px;

    word-wrap:break-word;

    animation:fade .15s ease;

    box-shadow:
    0 5px 20px rgba(0,0,0,.15);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.eu{
    background:#2563eb;
    align-self:flex-end;
    border-bottom-right-radius:6px;
}

.outro{
    background:#374151;
    align-self:flex-start;
    border-bottom-left-radius:6px;
}

.nome{
    font-size:12px;
    opacity:.75;
    margin-bottom:5px;
    font-weight:bold;
}

.hora{
    font-size:10px;
    opacity:.55;
    margin-top:6px;
    text-align:right;
}

/* FORM */

.form{
    display:flex;

    gap:10px;

    padding:14px;

    background:#1e293b;

    border-top:
    1px solid #334155;
}

.form input{
    flex:1;

    padding:15px;

    border:none;

    border-radius:14px;

    background:#0f172a;

    color:white;

    outline:none;

    border:1px solid #334155;

    font-size:15px;
}

.form input:focus{
    border-color:#2563eb;
}

.form button{
    border:none;

    min-width:55px;

    padding:14px;

    border-radius:14px;

    background:#2563eb;

    color:white;

    cursor:pointer;

    font-size:18px;

    transition:.2s;
}

.form button:hover{
    transform:scale(1.05);
}

/* BOTOES */

.botoes{
    display:flex;
    gap:10px;
}

.botoes button{
    border:none;

    background:#334155;

    color:white;

    width:42px;
    height:42px;

    border-radius:12px;

    cursor:pointer;

    font-size:16px;

    transition:.2s;
}

.botoes button:hover{
    background:#475569;
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:0;
    }

    .login{
        width:92%;
        max-width:none;
        border-radius:20px;
    }

    .chat-container{
        width:100%;
        max-width:none;

        height:100dvh;

        border-radius:0;

        border:none;
    }

    .topo{
        padding:14px;
    }

    .topo h2{
        font-size:16px;
    }

    #chat{
        padding:12px;
        gap:10px;
    }

    .msg{
        max-width:90%;
        font-size:14px;
    }

    .form{
        padding:10px;
    }

    .form input{
        padding:14px;
        font-size:16px;
    }

    .form button{
        min-width:52px;
        height:52px;
    }

    .botoes button{
        width:40px;
        height:40px;
    }
}

/* MOBILE PEQUENO */

@media(max-width:420px){

    .msg{
        max-width:95%;
    }

    .topo h2{
        font-size:15px;
    }

    .online{
        font-size:11px;
    }

    .login{
        padding:24px;
    }
}

</style>
</head>
<body>

<!-- LOGIN -->

<div class="login" id="loginBox">

    <h2>🔐 Área Privada</h2>

    <input
        type="password"
        id="senha"
        placeholder="Digite a senha"
    />

    <button id="entrarBtn">
        Entrar
    </button>

</div>

<!-- CHAT -->

<div class="chat-container" id="chatContainer">

    <div class="topo">

        <div>
            <h2>💬 Chat Realtime</h2>
            <div class="online">
                🟢 Online
            </div>
        </div>

        <div class="botoes">

            <button id="trocarNomeBtn">
                👤
            </button>

            <button id="limparBtn">
                🗑️
            </button>

        </div>

    </div>

    <div id="chat"></div>

    <form class="form" id="form">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite..."
            autocomplete="off"
            required
        />

        <button type="submit">
            ➤
        </button>

    </form>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// CONFIG

const SENHA = "a1234";

const SUPABASE_URL =
"https://xpfzqbjyizftllasvbll.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU";

// TEMPO PARA LIMPAR AUTOMÁTICO
// 5 minutos = 300000

const AUTO_DELETE_TEMPO = 300000;

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ELEMENTOS

const loginBox =
document.getElementById("loginBox");

const chatContainer =
document.getElementById("chatContainer");

const entrarBtn =
document.getElementById("entrarBtn");

const chat =
document.getElementById("chat");

const form =
document.getElementById("form");

const mensagemInput =
document.getElementById("mensagem");

// CONTROLE

let ultimaMensagemId = 0;

let usuario = "";

// LOGIN

entrarBtn.onclick = entrar;

function entrar(){

    const senha =
    document.getElementById("senha").value;

    if(senha !== SENHA){

        alert("Senha incorreta");

        return;
    }

    loginBox.style.display = "none";

    chatContainer.style.display = "flex";

    iniciarChat();
}

// CHAT

async function iniciarChat(){

    usuario =
    localStorage.getItem("usuario");

    if(!usuario){

        usuario =
        prompt("Seu nome?");

        if(!usuario){

            usuario = "Anônimo";
        }

        localStorage.setItem(
            "usuario",
            usuario
        );
    }

    // TROCAR NOME

    document
    .getElementById("trocarNomeBtn")
    .onclick = () => {

        const novo =
        prompt("Novo nome:");

        if(novo){

            usuario = novo;

            localStorage.setItem(
                "usuario",
                usuario
            );
        }
    };

    // LIXEIRA

    document
    .getElementById("limparBtn")
    .onclick = async () => {

        const confirmar =
        confirm(
            "Deseja apagar TODAS as mensagens?"
        );

        if(!confirmar) return;

        const { error } =
        await supabaseClient
        .from("mensagens")
        .delete()
        .gt("id",0);

        if(error){

            console.log(error);

            alert(
                "Erro ao limpar"
            );

            return;
        }

        chat.innerHTML = "";

        ultimaMensagemId = 0;
    };

    // RENDER

    function renderMensagem(msg){

        // EVITAR DUPLICAÇÃO

        if(
            document.getElementById(
                "msg-" + msg.id
            )
        ){
            return;
        }

        const div =
        document.createElement("div");

        div.id =
        "msg-" + msg.id;

        const eu =
        msg.usuario === usuario;

        div.className =
        "msg " + (eu ? "eu" : "outro");

        const hora =
        new Date(msg.criado_em)
        .toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });

        div.innerHTML = `
            <div class="nome">
                ${msg.usuario}
            </div>

            <div>
                ${msg.texto}
            </div>

            <div class="hora">
                ${hora}
            </div>
        `;

        chat.appendChild(div);

        chat.scrollTop =
        chat.scrollHeight;
    }

    // CARREGAR

    async function carregarMensagens(){

        const { data, error } =
        await supabaseClient
        .from("mensagens")
        .select("*")
        .order("id",{
            ascending:true
        });

        if(error){

            console.log(error);

            return;
        }

        chat.innerHTML = "";

        data.forEach(msg => {

            renderMensagem(msg);

            if(msg.id > ultimaMensagemId){

                ultimaMensagemId = msg.id;
            }

        });
    }

    // NOVAS

    async function buscarNovasMensagens(){

        const { data, error } =
        await supabaseClient
        .from("mensagens")
        .select("*")
        .gt("id", ultimaMensagemId)
        .order("id",{
            ascending:true
        });

        if(error){

            console.log(error);

            return;
        }

        data.forEach(msg => {

            renderMensagem(msg);

            ultimaMensagemId =
            msg.id;

        });
    }

    // LIMPEZA AUTOMÁTICA

    async function limparMensagensAntigas(){

        const tempoLimite =
        new Date(
            Date.now() -
            AUTO_DELETE_TEMPO
        ).toISOString();

        const { error } =
        await supabaseClient
        .from("mensagens")
        .delete()
        .lt(
            "criado_em",
            tempoLimite
        );

        if(error){

            console.log(
                "Erro auto limpeza:",
                error
            );
        }

        await carregarMensagens();
    }

    // HISTÓRICO

    await carregarMensagens();

    // REALTIME

    supabaseClient
    .channel("chat-global")
    .on(
        "postgres_changes",
        {
            event:"INSERT",
            schema:"public",
            table:"mensagens"
        },

        payload => {

            if(
                payload.new.id >
                ultimaMensagemId
            ){

                renderMensagem(
                    payload.new
                );

                ultimaMensagemId =
                payload.new.id;
            }

        }
    )
    .subscribe(status => {

        console.log(
            "Realtime:",
            status
        );

    });

    // ATUALIZAÇÃO 1 SEGUNDO

    setInterval(() => {

        buscarNovasMensagens();

    },1000);

    // AUTO DELETE

    setInterval(() => {

        limparMensagensAntigas();

    },10000);

    // ENVIAR

    form.addEventListener(
        "submit",

        async e => {

            e.preventDefault();

            const texto =
            mensagemInput.value.trim();

            if(!texto) return;

            const { error } =
            await supabaseClient
            .from("mensagens")
            .insert([{
                usuario,
                texto
            }]);

            if(error){

                console.log(error);

                alert(
                    "Erro ao enviar"
                );

                return;
            }

            mensagemInput.value = "";

            mensagemInput.focus();
        }
    );
}

</script>

</body>
</html>
