<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Chat Realtime Supabase</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
    linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
    );

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.chat-container{

    width:100%;
    max-width:520px;
    height:95vh;

    background:#111827;

    border-radius:18px;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    border:1px solid #334155;

    box-shadow:
    0 0 40px rgba(0,0,0,.4);

}

.topo{

    background:#1e293b;

    padding:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:
    1px solid #334155;

}

.topo h2{
    font-size:18px;
}

.online{
    font-size:12px;
    color:#22c55e;
    margin-top:4px;
}

#chat{

    flex:1;

    overflow-y:auto;

    padding:15px;

    display:flex;
    flex-direction:column;

    gap:12px;

}

#chat::-webkit-scrollbar{
    width:6px;
}

#chat::-webkit-scrollbar-thumb{
    background:#475569;
    border-radius:10px;
}

.msg{

    max-width:80%;

    padding:12px 15px;

    border-radius:16px;

    animation:fade .2s ease;

    word-wrap:break-word;

}

.eu{
    background:#2563eb;
    align-self:flex-end;
}

.outro{
    background:#374151;
    align-self:flex-start;
}

.nome{
    font-size:12px;
    opacity:.7;
    margin-bottom:5px;
}

.hora{
    font-size:10px;
    opacity:.5;
    margin-top:6px;
    text-align:right;
}

.form{

    display:flex;

    gap:10px;

    padding:12px;

    background:#1e293b;

    border-top:
    1px solid #334155;

}

.form input{

    flex:1;

    padding:14px;

    border:none;

    border-radius:12px;

    outline:none;

    background:#0f172a;

    color:white;

    border:
    1px solid #334155;

}

.form input:focus{

    border-color:#2563eb;

}

.form button{

    border:none;

    padding:14px 18px;

    border-radius:12px;

    background:#2563eb;

    color:white;

    cursor:pointer;

    transition:.2s;

}

.form button:hover{

    background:#3b82f6;

}

.acoes{

    display:flex;
    gap:10px;

}

.acoes button{

    border:none;

    padding:10px 12px;

    border-radius:10px;

    cursor:pointer;

    color:white;

}

#limpar{
    background:#f59e0b;
}

#trocar{
    background:#ef4444;
}

.loading{
    opacity:.5;
    pointer-events:none;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media(max-width:600px){

    .chat-container{
        height:100vh;
        max-width:100%;
        border-radius:0;
    }

}

</style>

</head>
<body>

<div class="chat-container">

    <div class="topo">

        <div>

            <h2>
                💬 Chat Realtime
            </h2>

            <div class="online">
                🟢 Online
            </div>

        </div>

        <div class="acoes">

            <button id="limpar">
                🗑
            </button>

            <button id="trocar">
                👤
            </button>

        </div>

    </div>

    <div id="chat"></div>

    <form
    class="form"
    id="form">

        <input
        type="text"
        id="mensagem"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
        />

        <button
        type="submit"
        id="enviarBtn">

            Enviar

        </button>

    </form>

</div>

<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// =====================================
// SUPABASE
// =====================================

const supabase =
createClient(

"https://xpfzqbjyizftllasvbll.supabase.co",

"sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU"

)

// =====================================
// ELEMENTOS
// =====================================

const chat =
document.getElementById("chat")

const form =
document.getElementById("form")

const mensagem =
document.getElementById("mensagem")

const enviarBtn =
document.getElementById("enviarBtn")

const limparBtn =
document.getElementById("limpar")

const trocarBtn =
document.getElementById("trocar")

// =====================================
// USUARIO
// =====================================

let usuario =
localStorage.getItem("usuario")

if(!usuario){

    usuario =
    prompt("Digite seu nome")

    if(!usuario){

        usuario = "Anônimo"

    }

    localStorage.setItem(
        "usuario",
        usuario
    )

}

// =====================================
// AUTO FOCUS
// =====================================

mensagem.focus()

// =====================================
// ANTI DUPLICAÇÃO
// =====================================

const ids =
new Set()

// =====================================
// RENDER
// =====================================

function renderMensagem(msg){

    if(ids.has(msg.id)) return

    ids.add(msg.id)

    const div =
    document.createElement("div")

    div.className =
    msg.usuario === usuario
    ? "msg eu"
    : "msg outro"

    const hora =
    new Date(
        msg.created_at
    ).toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
    })

    div.innerHTML = `

        <div class="nome">
            ${msg.usuario}
        </div>

        <div>
            ${msg.texto}
        </div>

        <div class="hora">
            ${hora}
        </div>

    `

    chat.appendChild(div)

    requestAnimationFrame(()=>{

        chat.scrollTop =
        chat.scrollHeight

    })

}

// =====================================
// CARREGAR HISTÓRICO
// =====================================

async function carregarHistorico(){

    const {
        data,
        error
    } = await supabase

    .from("mensagens")

    .select("*")

    .order("id",{
        ascending:true
    })

    if(error){

        console.error(error)

        alert(
            "Erro ao carregar histórico"
        )

        return

    }

    chat.innerHTML = ""

    data.forEach(renderMensagem)

}

// =====================================
// ENVIAR
// =====================================

let enviando = false

async function enviarMensagem(){

    if(enviando) return

    const texto =
    mensagem.value.trim()

    if(!texto) return

    enviando = true

    enviarBtn.innerText = "..."

    enviarBtn.classList.add(
        "loading"
    )

    const resposta =
    await supabase

    .from("mensagens")

    .insert([
        {
            usuario,
            texto
        }
    ])

    .select()

    enviando = false

    enviarBtn.innerText =
    "Enviar"

    enviarBtn.classList.remove(
        "loading"
    )

    console.log(resposta)

    if(resposta.error){

        console.error(
            resposta.error
        )

        alert(
            resposta.error.message
        )

        return

    }

    mensagem.value = ""

    mensagem.focus()

}

// =====================================
// ENTER FUNCIONANDO
// =====================================

form.addEventListener(
"submit",

async e => {

    e.preventDefault()

    await enviarMensagem()

}

)

// =====================================
// TROCAR USUARIO
// =====================================

trocarBtn.addEventListener(
"click",

()=>{

    const novo =
    prompt("Novo nome:")

    if(!novo) return

    usuario = novo

    localStorage.setItem(
        "usuario",
        usuario
    )

}

)

// =====================================
// LIMPAR CHAT
// =====================================

limparBtn.addEventListener(
"click",

async ()=>{

    const ok =
    confirm(
        "Deseja limpar o chat?"
    )

    if(!ok) return

    const resposta =
    await supabase

    .from("mensagens")

    .delete()

    .neq("id",0)

    if(resposta.error){

        alert(
            resposta.error.message
        )

        return

    }

    ids.clear()

    chat.innerHTML = ""

}

)

// =====================================
// INICIAR
// =====================================

await carregarHistorico()

// =====================================
// REALTIME
// =====================================

supabase

.channel("chat-global")

.on(

"postgres_changes",

{
    event:"INSERT",
    schema:"public",
    table:"mensagens"
},

payload => {

    renderMensagem(
        payload.new
    )

}

)

.subscribe(status=>{

    console.log(
        "Realtime:",
        status
    )

})

</script>

</body>
</html>
