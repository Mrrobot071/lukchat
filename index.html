<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat</title>

<style>
 
:root{
    --primary:#fc3c3c;
    --primary2:#ff2d75;
    --primary3:#ff5f8f;

    --bg:#090909;
    --card:#141414;
    --card2:#1b1b1b;

    --border:#2b2b2b;

    --text:#ffffff;
    --text2:#cfcfcf;

    --gradient:linear-gradient(135deg,#fc3c3c,#ff2d75);
    --shadow:0 0 40px rgba(255,45,117,.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    background:
    radial-gradient(circle at top,#391313 0%,transparent 35%),
    radial-gradient(circle at bottom right,#4d1231 0%,transparent 35%),
    var(--bg);

    height:100vh;
    height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    color:var(--text);

    overflow:hidden;
}

/* LOGIN */

.login{

    width:100%;
    max-width:360px;

    padding:30px;

    border-radius:26px;

    background:rgba(20,20,20,.92);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:var(--shadow);

    display:flex;
    flex-direction:column;

    gap:16px;

}

.login h2{

    text-align:center;

    font-size:24px;

    background:var(--gradient);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

}

.login input{

    padding:15px;

    border-radius:16px;

    background:#222;

    border:1px solid #333;

    color:white;

    outline:none;

    transition:.3s;

    font-size:16px;

}

.login input:focus{

    border-color:#ff2d75;

    box-shadow:
    0 0 0 3px rgba(255,45,117,.15),
    0 0 20px rgba(255,45,117,.25);

}

.login button{

    padding:15px;

    border:none;

    border-radius:16px;

    background:var(--gradient);

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

}

.login button:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(255,45,117,.45);

}

/* CHAT */

.chat-container{

    width:100%;
    max-width:530px;

    height:95vh;
    height:95dvh;

    display:none;

    flex-direction:column;

    overflow:hidden;

    border-radius:28px;

    background:rgba(18,18,18,.94);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:var(--shadow);

}

@media(max-width:480px){

body{
padding:0;
}

.chat-container{

height:100vh;
height:100dvh;

border-radius:0;

}

}

/* TOPO */

.topo{

    background:var(--gradient);

    padding:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 10px 25px rgba(0,0,0,.3);

}

.topo h2{

    font-size:19px;

}

.online{

    color:#fff;

    opacity:.9;

    font-size:12px;

}

/* CHAT */

#chat{

    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;

    flex-direction:column;

    gap:12px;

}

/* MENSAGENS */

.msg{

    max-width:82%;

    padding:13px 16px;

    border-radius:18px;

    animation:fade .25s;

    word-break:break-word;

}

.eu{

    align-self:flex-end;

    background:var(--gradient);

    color:white;

    border-bottom-right-radius:6px;

    box-shadow:
    0 8px 20px rgba(255,45,117,.25);

}

.outro{

    align-self:flex-start;

    background:#222;

    color:white;

    border:1px solid #303030;

    border-bottom-left-radius:6px;

}

.nome{

    font-size:12px;

    font-weight:700;

    opacity:.85;

    margin-bottom:5px;

}

.hora{

    margin-top:6px;

    text-align:right;

    font-size:10px;

    opacity:.55;

}

/* FORM */

.form{

    display:flex;

    gap:10px;

    padding:14px;

    background:#181818;

    border-top:1px solid #2d2d2d;

}

.form input{

    flex:1;

    padding:15px;

    border-radius:16px;

    background:#232323;

    border:1px solid #333;

    color:white;

    outline:none;

    font-size:16px;

}

.form input:focus{

    border-color:#ff2d75;

    box-shadow:
    0 0 18px rgba(255,45,117,.25);

}

.form button{

    width:58px;

    border:none;

    border-radius:16px;

    background:var(--gradient);

    color:white;

    font-size:20px;

    cursor:pointer;

    transition:.25s;

}

.form button:hover{

    transform:scale(1.05);

}

/* BOTÕES */

.botoes{

    display:flex;

    gap:8px;

}

.botoes button{

    width:46px;

    height:46px;

    border:none;

    border-radius:14px;

    background:rgba(255,255,255,.15);

    color:white;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.25s;

}

.botoes button:hover{

    background:rgba(255,255,255,.25);

    transform:translateY(-2px);

}

#timerMinutos{

    font-size:10px;

    color:white;

    font-weight:bold;

}

::-webkit-scrollbar{

width:8px;

}

::-webkit-scrollbar-thumb{

background:var(--gradient);

border-radius:20px;

}

::-webkit-scrollbar-track{

background:#171717;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(8px);

}

to{

opacity:1;

transform:none;

}

}
 
</style>
</head>
<body>

<div class="login" id="loginBox">
    <h2>🔐 Área Privada</h2>
    <input
        type="password"
        id="senha"
        placeholder="Digite a senha"
    />
    <button id="entrarBtn">Entrar</button>
</div>

<div class="chat-container" id="chatContainer">
    <div class="topo">
        <div>
            <h2>💬 Chat Realtime</h2>
            <div class="online">🟢 Online</div>
        </div>

        <div class="botoes">
            <button id="timerBtn" title="Configurar Temporizador">
                ⏱️ <span id="timerMinutos">Off</span>
            </button>

            <button id="trocarNomeBtn" title="Trocar nome">
                👤
            </button>

            <button id="limparBtn" title="Limpar chat">
                🗑️
            </button>
        </div>
    </div>

    <div id="chat"></div>

    <form class="form" id="form">
        <input
            type="text"
            id="mensagem"
            placeholder="Digite..."
            autocomplete="off"
            required
        />
        <button type="submit">➤</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ======================================
// CONFIG
// ======================================

const SENHA = "a1234";

const TEMPO_LOGIN =
6 * 60 * 60 * 1000;
// 6 horas

const SUPABASE_URL =
"https://xpfzqbjyizftllasvbll.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU";

// ======================================
// SUPABASE
// ======================================

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ======================================
// ELEMENTOS
// ======================================

const loginBox =
document.getElementById("loginBox");

const chatContainer =
document.getElementById("chatContainer");

const entrarBtn =
document.getElementById("entrarBtn");

const senhaInput =
document.getElementById("senha");

const form =
document.getElementById("form");

const mensagemInput =
document.getElementById("mensagem");

const chat =
document.getElementById("chat");

const limparBtn =
document.getElementById("limparBtn");

const trocarNomeBtn =
document.getElementById("trocarNomeBtn");

const timerBtn =
document.getElementById("timerBtn");

const timerMinutos =
document.getElementById("timerMinutos");

// ======================================
// CONTROLE
// ======================================

let usuario = "";

let intervaloLimpeza = null;

let chatIniciado = false;

// ======================================
// VERIFICAR LOGIN CACHE
// ======================================

verificarLoginCache();

// ======================================
// EVENTOS LOGIN
// ======================================

entrarBtn.addEventListener(
    "click",
    entrar
);

senhaInput.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            entrar();
        }
    }
);

// ======================================
// VERIFICAR CACHE
// ======================================

function verificarLoginCache(){

    const loginSalvo =
    localStorage.getItem(
        "chat_login"
    );

    const timestamp =
    localStorage.getItem(
        "chat_login_time"
    );

    if(
        !loginSalvo
        ||
        !timestamp
    ){
        return;
    }

    const agora =
    Date.now();

    const diferenca =
    agora - Number(timestamp);

    if(
        diferenca <
        TEMPO_LOGIN
    ){

        liberarChat();

    }else{

        localStorage.removeItem(
            "chat_login"
        );

        localStorage.removeItem(
            "chat_login_time"
        );
    }
}

// ======================================
// LOGIN
// ======================================

function entrar(){

    const senha =
    senhaInput.value.trim();

    if(senha !== SENHA){

        alert(
            "Senha incorreta"
        );

        return;
    }

    localStorage.setItem(
        "chat_login",
        "true"
    );

    localStorage.setItem(
        "chat_login_time",
        Date.now()
    );

    liberarChat();
}

// ======================================
// LIBERAR CHAT
// ======================================

function liberarChat(){

    loginBox.style.display =
    "none";

    chatContainer.style.display =
    "flex";

    iniciarChat();
}

// ======================================
// LOGOUT
// ======================================

function logout(){

    localStorage.removeItem(
        "chat_login"
    );

    localStorage.removeItem(
        "chat_login_time"
    );

    location.reload();
}

// ======================================
// INICIAR CHAT
// ======================================

async function iniciarChat(){

    if(chatIniciado) return;

    chatIniciado = true;

    usuario =
    localStorage.getItem(
        "usuario"
    );

    if(!usuario){

        usuario =
        prompt("Seu nome?");

        if(!usuario){

            usuario =
            "Anônimo";
        }

        localStorage.setItem(
            "usuario",
            usuario
        );
    }

    // ======================================
    // TROCAR NOME
    // ======================================

    trocarNomeBtn.onclick =
    () => {

        const novo =
        prompt("Novo nome:");

        if(!novo) return;

        usuario = novo;

        localStorage.setItem(
            "usuario",
            usuario
        );
    };

    // ======================================
    // LIMPAR CHAT
    // ======================================

    limparBtn.onclick =
    async () => {

        const ok =
        confirm(
            "Apagar todas mensagens?"
        );

        if(!ok) return;

        const { error } =
        await supabaseClient

        .from("mensagens")

        .delete()

        .not(
            "id",
            "is",
            null
        );

        if(error){

            console.log(error);

            alert(
                "Erro ao limpar"
            );

            return;
        }

        await carregarMensagens();
    };

    // ======================================
    // TIMER
    // ======================================

    timerBtn.onclick =
    () => {

        const valor =
        prompt(
            "Tempo em minutos:"
        );

        if(valor === null)
        return;

        const minutos =
        parseInt(valor);

        clearInterval(
            intervaloLimpeza
        );

        intervaloLimpeza =
        null;

        if(
            isNaN(minutos)
            ||
            minutos <= 0
        ){

            timerMinutos.innerText =
            "Off";

            alert(
                "Temporizador desligado"
            );

            return;
        }

        timerMinutos.innerText =
        minutos + "m";

        intervaloLimpeza =
        setInterval(
        async () => {

            const { error } =
            await supabaseClient

            .from("mensagens")

            .delete()

            .not(
                "id",
                "is",
                null
            );

            if(error){

                console.log(error);

                return;
            }

            await carregarMensagens();

        }, minutos * 60000);

        alert(
            `Limpeza automática: ${minutos} min`
        );
    };

    // ======================================
    // LOAD INICIAL
    // ======================================

    await carregarMensagens();

    // ======================================
    // REALTIME
    // ======================================

    supabaseClient

    .channel("chat-global")

    .on(
        "postgres_changes",

        {
            event:"*",
            schema:"public",
            table:"mensagens"
        },

        async payload => {

            console.log(payload);

            await carregarMensagens();
        }
    )

    .subscribe(status => {

        console.log(
            "Realtime:",
            status
        );
    });
}

// ======================================
// CARREGAR MSG
// ======================================

async function carregarMensagens(){

    const { data, error } =

    await supabaseClient

    .from("mensagens")

    .select("*")

    .order(
        "criado_em",
        {
            ascending:true
        }
    );

    if(error){

        console.log(error);

        return;
    }

    chat.innerHTML = "";

    data.forEach(msg => {

        const div =
        document.createElement("div");

        div.className =
        "msg " +

        (
            msg.usuario === usuario
            ? "eu"
            : "outro"
        );

        const hora =
        new Date(
            msg.criado_em
        )

        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

        div.innerHTML = `

            <div class="nome">
                ${msg.usuario}
            </div>

            <div>
                ${msg.texto}
            </div>

            <div class="hora">
                ${hora}
            </div>

        `;

        chat.appendChild(div);
    });

    chat.scrollTop =
    chat.scrollHeight;
}

// ======================================
// ENVIAR MSG
// ======================================

form.addEventListener(

    "submit",

    async e => {

        e.preventDefault();

        const texto =
        mensagemInput.value.trim();

        if(!texto) return;

        mensagemInput.disabled =
        true;

        const { error } =

        await supabaseClient

        .from("mensagens")

        .insert([
            {
                usuario,
                texto
            }
        ]);

        mensagemInput.disabled =
        false;

        if(error){

            console.log(error);

            alert(
                "Erro ao enviar"
            );

            return;
        }

        mensagemInput.value = "";

        mensagemInput.focus();

        await carregarMensagens();
    }
);

</script>

</body>
</html>
