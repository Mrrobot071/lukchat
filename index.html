<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat</title>

<style>
:root{
    --primary:#fc3c3c;
    --primary-dark:#d92f2f;
    --primary-light:#ff6262;
    --bg:#fff5f5;
    --surface:#ffffff;
    --surface-2:#ffe8e8;
    --border:#ffb3b3;
    --text:#2b2b2b;
    --text-light:#777;
    --shadow:0 15px 35px rgba(252,60,60,.18);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        linear-gradient(135deg,#fff7f7,#ffe5e5,#ffd5d5);
    height:100vh;
    height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
    color:var(--text);
}

/* LOGIN */

.login{
    width:100%;
    max-width:360px;
    background:var(--surface);
    padding:30px;
    border-radius:22px;
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:16px;
    box-shadow:var(--shadow);
}

.login h2{
    text-align:center;
    color:var(--primary);
}

.login input{
    padding:15px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    outline:none;
    transition:.25s;
    font-size:16px;
}

.login input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(252,60,60,.12);
}

.login button{
    padding:15px;
    border:none;
    border-radius:14px;
    background:var(--primary);
    color:#fff;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
    transition:.25s;
}

.login button:hover{
    background:var(--primary-dark);
}

/* CHAT */

.chat-container{
    width:100%;
    max-width:540px;
    height:95vh;
    height:95dvh;
    background:var(--surface);
    border-radius:22px;
    overflow:hidden;
    display:none;
    flex-direction:column;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

@media (max-width:480px){

    body{
        padding:0;
    }

    .chat-container{
        height:100vh;
        height:100dvh;
        border-radius:0;
        border:none;
    }

}

.topo{
    background:var(--primary);
    color:#fff;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topo h2{
    font-size:18px;
}

.online{
    font-size:12px;
    color:#fff;
    opacity:.9;
    margin-top:4px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:var(--bg);
}

.msg{
    max-width:82%;
    padding:13px 15px;
    border-radius:18px;
    word-break:break-word;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.eu{
    background:var(--primary);
    color:#fff;
    align-self:flex-end;
    border-bottom-right-radius:6px;
}

.outro{
    background:#fff;
    color:var(--text);
    border:1px solid var(--border);
    align-self:flex-start;
    border-bottom-left-radius:6px;
}

.nome{
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
    opacity:.85;
}

.hora{
    font-size:10px;
    opacity:.6;
    margin-top:8px;
    text-align:right;
}

.form{
    display:flex;
    gap:10px;
    padding:14px;
    background:#fff;
    border-top:1px solid var(--border);
}

.form input{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    outline:none;
    font-size:16px;
    transition:.25s;
}

.form input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(252,60,60,.12);
}

.form button{
    padding:14px 18px;
    border:none;
    border-radius:14px;
    background:var(--primary);
    color:#fff;
    cursor:pointer;
    font-size:16px;
    transition:.25s;
}

.form button:hover{
    background:var(--primary-dark);
}

.botoes{
    display:flex;
    gap:8px;
}

.botoes button{
    width:48px;
    height:48px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:#fff;
    cursor:pointer;
    transition:.25s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(8px);
}

.botoes button:hover{
    background:rgba(255,255,255,.3);
}

#timerMinutos{
    font-size:11px;
    margin-top:2px;
    font-weight:bold;
    color:#fff;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#ffe5e5;
}

::-webkit-scrollbar-thumb{
    background:var(--primary);
    border-radius:20px;
}

::placeholder{
    color:#999;
}

button{
    transition:.25s;
}

button:active{
    transform:scale(.97);
}
</style>
</head>
<body>

<div class="login" id="loginBox">
    <h2>🔐 Área Privada</h2>
    <input
        type="password"
        id="senha"
        placeholder="Digite a senha"
    />
    <button id="entrarBtn">Entrar</button>
</div>

<div class="chat-container" id="chatContainer">
    <div class="topo">
        <div>
            <h2>💬 Chat Realtime</h2>
            <div class="online">🟢 Online</div>
        </div>

        <div class="botoes">
            <button id="timerBtn" title="Configurar Temporizador">
                ⏱️ <span id="timerMinutos">Off</span>
            </button>

            <button id="trocarNomeBtn" title="Trocar nome">
                👤
            </button>

            <button id="limparBtn" title="Limpar chat">
                🗑️
            </button>
        </div>
    </div>

    <div id="chat"></div>

    <form class="form" id="form">
        <input
            type="text"
            id="mensagem"
            placeholder="Digite..."
            autocomplete="off"
            required
        />
        <button type="submit">➤</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ======================================
// CONFIG
// ======================================

const SENHA = "a1234";

const TEMPO_LOGIN =
6 * 60 * 60 * 1000;
// 6 horas

const SUPABASE_URL =
"https://xpfzqbjyizftllasvbll.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU";

// ======================================
// SUPABASE
// ======================================

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ======================================
// ELEMENTOS
// ======================================

const loginBox =
document.getElementById("loginBox");

const chatContainer =
document.getElementById("chatContainer");

const entrarBtn =
document.getElementById("entrarBtn");

const senhaInput =
document.getElementById("senha");

const form =
document.getElementById("form");

const mensagemInput =
document.getElementById("mensagem");

const chat =
document.getElementById("chat");

const limparBtn =
document.getElementById("limparBtn");

const trocarNomeBtn =
document.getElementById("trocarNomeBtn");

const timerBtn =
document.getElementById("timerBtn");

const timerMinutos =
document.getElementById("timerMinutos");

// ======================================
// CONTROLE
// ======================================

let usuario = "";

let intervaloLimpeza = null;

let chatIniciado = false;

// ======================================
// VERIFICAR LOGIN CACHE
// ======================================

verificarLoginCache();

// ======================================
// EVENTOS LOGIN
// ======================================

entrarBtn.addEventListener(
    "click",
    entrar
);

senhaInput.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            entrar();
        }
    }
);

// ======================================
// VERIFICAR CACHE
// ======================================

function verificarLoginCache(){

    const loginSalvo =
    localStorage.getItem(
        "chat_login"
    );

    const timestamp =
    localStorage.getItem(
        "chat_login_time"
    );

    if(
        !loginSalvo
        ||
        !timestamp
    ){
        return;
    }

    const agora =
    Date.now();

    const diferenca =
    agora - Number(timestamp);

    if(
        diferenca <
        TEMPO_LOGIN
    ){

        liberarChat();

    }else{

        localStorage.removeItem(
            "chat_login"
        );

        localStorage.removeItem(
            "chat_login_time"
        );
    }
}

// ======================================
// LOGIN
// ======================================

function entrar(){

    const senha =
    senhaInput.value.trim();

    if(senha !== SENHA){

        alert(
            "Senha incorreta"
        );

        return;
    }

    localStorage.setItem(
        "chat_login",
        "true"
    );

    localStorage.setItem(
        "chat_login_time",
        Date.now()
    );

    liberarChat();
}

// ======================================
// LIBERAR CHAT
// ======================================

function liberarChat(){

    loginBox.style.display =
    "none";

    chatContainer.style.display =
    "flex";

    iniciarChat();
}

// ======================================
// LOGOUT
// ======================================

function logout(){

    localStorage.removeItem(
        "chat_login"
    );

    localStorage.removeItem(
        "chat_login_time"
    );

    location.reload();
}

// ======================================
// INICIAR CHAT
// ======================================

async function iniciarChat(){

    if(chatIniciado) return;

    chatIniciado = true;

    usuario =
    localStorage.getItem(
        "usuario"
    );

    if(!usuario){

        usuario =
        prompt("Seu nome?");

        if(!usuario){

            usuario =
            "Anônimo";
        }

        localStorage.setItem(
            "usuario",
            usuario
        );
    }

    // ======================================
    // TROCAR NOME
    // ======================================

    trocarNomeBtn.onclick =
    () => {

        const novo =
        prompt("Novo nome:");

        if(!novo) return;

        usuario = novo;

        localStorage.setItem(
            "usuario",
            usuario
        );
    };

    // ======================================
    // LIMPAR CHAT
    // ======================================

    limparBtn.onclick =
    async () => {

        const ok =
        confirm(
            "Apagar todas mensagens?"
        );

        if(!ok) return;

        const { error } =
        await supabaseClient

        .from("mensagens")

        .delete()

        .not(
            "id",
            "is",
            null
        );

        if(error){

            console.log(error);

            alert(
                "Erro ao limpar"
            );

            return;
        }

        await carregarMensagens();
    };

    // ======================================
    // TIMER
    // ======================================

    timerBtn.onclick =
    () => {

        const valor =
        prompt(
            "Tempo em minutos:"
        );

        if(valor === null)
        return;

        const minutos =
        parseInt(valor);

        clearInterval(
            intervaloLimpeza
        );

        intervaloLimpeza =
        null;

        if(
            isNaN(minutos)
            ||
            minutos <= 0
        ){

            timerMinutos.innerText =
            "Off";

            alert(
                "Temporizador desligado"
            );

            return;
        }

        timerMinutos.innerText =
        minutos + "m";

        intervaloLimpeza =
        setInterval(
        async () => {

            const { error } =
            await supabaseClient

            .from("mensagens")

            .delete()

            .not(
                "id",
                "is",
                null
            );

            if(error){

                console.log(error);

                return;
            }

            await carregarMensagens();

        }, minutos * 60000);

        alert(
            `Limpeza automática: ${minutos} min`
        );
    };

    // ======================================
    // LOAD INICIAL
    // ======================================

    await carregarMensagens();

    // ======================================
    // REALTIME
    // ======================================

    supabaseClient

    .channel("chat-global")

    .on(
        "postgres_changes",

        {
            event:"*",
            schema:"public",
            table:"mensagens"
        },

        async payload => {

            console.log(payload);

            await carregarMensagens();
        }
    )

    .subscribe(status => {

        console.log(
            "Realtime:",
            status
        );
    });
}

// ======================================
// CARREGAR MSG
// ======================================

async function carregarMensagens(){

    const { data, error } =

    await supabaseClient

    .from("mensagens")

    .select("*")

    .order(
        "criado_em",
        {
            ascending:true
        }
    );

    if(error){

        console.log(error);

        return;
    }

    chat.innerHTML = "";

    data.forEach(msg => {

        const div =
        document.createElement("div");

        div.className =
        "msg " +

        (
            msg.usuario === usuario
            ? "eu"
            : "outro"
        );

        const hora =
        new Date(
            msg.criado_em
        )

        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

        div.innerHTML = `

            <div class="nome">
                ${msg.usuario}
            </div>

            <div>
                ${msg.texto}
            </div>

            <div class="hora">
                ${hora}
            </div>

        `;

        chat.appendChild(div);
    });

    chat.scrollTop =
    chat.scrollHeight;
}

// ======================================
// ENVIAR MSG
// ======================================

form.addEventListener(

    "submit",

    async e => {

        e.preventDefault();

        const texto =
        mensagemInput.value.trim();

        if(!texto) return;

        mensagemInput.disabled =
        true;

        const { error } =

        await supabaseClient

        .from("mensagens")

        .insert([
            {
                usuario,
                texto
            }
        ]);

        mensagemInput.disabled =
        false;

        if(error){

            console.log(error);

            alert(
                "Erro ao enviar"
            );

            return;
        }

        mensagemInput.value = "";

        mensagemInput.focus();

        await carregarMensagens();
    }
);

</script>

</body>
</html>
