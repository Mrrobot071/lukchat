<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0"
>

<title>Chat Realtime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.chat-container{
    width:100%;
    max-width:500px;
    height:90vh;
    background:#1e293b;
    border-radius:15px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    border:1px solid #334155;
}

.topo{
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.topo h2{
    font-size:18px;
}

.acoes{
    display:flex;
    gap:10px;
}

button{
    border:none;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

#trocarBtn{
    background:#ef4444;
}

#limparBtn{
    background:#f59e0b;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    padding:10px 14px;
    border-radius:12px;
    max-width:80%;
    word-wrap:break-word;
}

.eu{
    background:#2563eb;
    align-self:flex-end;
}

.outro{
    background:#374151;
    align-self:flex-start;
}

.nome{
    font-size:12px;
    opacity:.7;
    margin-bottom:5px;
}

.form{
    display:flex;
    gap:10px;
    padding:10px;
    background:#111827;
}

.form input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

.form button{
    background:#2563eb;
}

</style>

</head>
<body>

<div class="chat-container">

    <div class="topo">

        <h2>Chat Online</h2>

        <div class="acoes">

            <button id="limparBtn">
                Limpar
            </button>

            <button id="trocarBtn">
                Trocar
            </button>

        </div>

    </div>

    <div id="chat"></div>

    <div class="form">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite uma mensagem..."
        >

        <button id="enviarBtn">
            Enviar
        </button>

    </div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
    'https://xpfzqbjyizftllasvbll.supabase.co',
    'sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU'
)

let usuario = localStorage.getItem("usuario")

if(!usuario){

    usuario = prompt("Digite seu nome")

    localStorage.setItem(
        "usuario",
        usuario
    )

}

const chat = document.getElementById("chat")
const mensagem = document.getElementById("mensagem")
const enviarBtn = document.getElementById("enviarBtn")
const limparBtn = document.getElementById("limparBtn")

// ======================================
// RENDER
// ======================================

function renderMensagem(msg){

    const div = document.createElement("div")

    div.className =
        msg.usuario === usuario
        ? "msg eu"
        : "msg outro"

    div.innerHTML = `
        <div class="nome">${msg.usuario}</div>
        <div>${msg.texto}</div>
    `

    chat.appendChild(div)

    chat.scrollTop = chat.scrollHeight

}

// ======================================
// CARREGAR HISTÓRICO
// ======================================

async function carregar(){

    const { data, error } = await supabase
        .from("mensagens")
        .select("*")
        .order("id", { ascending: true })

    if(error){

        console.error(error)
        return

    }

    chat.innerHTML = ""

    data.forEach(renderMensagem)

}

carregar()

// ======================================
// ENVIAR
// ======================================

async function enviar(){

    const texto = mensagem.value.trim()

    if(!texto) return

    const { error } = await supabase
        .from("mensagens")
        .insert([
            {
                usuario,
                texto
            }
        ])

    if(error){

        console.error(error)
        return

    }

    mensagem.value = ""

}

enviarBtn.addEventListener(
    "click",
    enviar
)

mensagem.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            enviar()

        }

    }
)

// ======================================
// REALTIME
// ======================================

supabase
.channel("sala-chat")
.on(
    "postgres_changes",
    {
        event: "INSERT",
        schema: "public",
        table: "mensagens"
    },
    payload => {

        renderMensagem(payload.new)

    }
)
.subscribe((status) => {

    console.log("STATUS REALTIME:", status)

})

// ======================================
// LIMPAR CHAT
// ======================================

limparBtn.addEventListener(
    "click",
    async () => {

        const confirmar = confirm(
            "Deseja limpar o chat?"
        )

        if(!confirmar) return

        await supabase
            .from("mensagens")
            .delete()
            .neq("id", 0)

        chat.innerHTML = ""

    }
)

</script>

</body>
</html>
