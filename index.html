<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Realtime PRO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
    linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
    );

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
}

.chat{
    width:100%;
    max-width:520px;
    height:95vh;
    background:#111827;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    border:1px solid #334155;
    box-shadow:
    0 0 40px rgba(0,0,0,.4);
}

.topo{
    background:#1e293b;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #334155;
}

.topo-esquerda{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.topo h2{
    font-size:18px;
}

.status{
    font-size:12px;
    color:#22c55e;
}

.acoes{
    display:flex;
    gap:10px;
}

button{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    color:white;
    transition:.2s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

#limpar{
    background:#f59e0b;
}

#trocar{
    background:#ef4444;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:12px;
    scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
    width:6px;
}

#chat::-webkit-scrollbar-thumb{
    background:#475569;
    border-radius:10px;
}

.msg{
    padding:12px 15px;
    border-radius:16px;
    max-width:80%;
    word-wrap:break-word;
    animation:fade .2s ease;
}

.eu{
    background:#2563eb;
    align-self:flex-end;
}

.outro{
    background:#374151;
    align-self:flex-start;
}

.nome{
    font-size:12px;
    opacity:.7;
    margin-bottom:5px;
}

.texto{
    line-height:1.4;
}

.hora{
    font-size:10px;
    opacity:.5;
    margin-top:6px;
    text-align:right;
}

.form{
    display:flex;
    gap:10px;
    padding:12px;
    background:#1e293b;
    border-top:1px solid #334155;
}

.form input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#0f172a;
    color:white;
    border:1px solid #334155;
    transition:.2s;
}

.form input:focus{
    border-color:#2563eb;
    box-shadow:
    0 0 0 3px rgba(37,99,235,.2);
}

.form button{
    background:#2563eb;
}

.form button:hover{
    background:#3b82f6;
}

.loading{
    opacity:.6;
    pointer-events:none;
}

.typing{
    padding:0 15px 10px;
    font-size:12px;
    color:#94a3b8;
    height:20px;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media(max-width:600px){

    .chat{
        height:100vh;
        max-width:100%;
        border-radius:0;
    }

}

</style>

</head>
<body>

<div class="chat">

    <div class="topo">

        <div class="topo-esquerda">

            <h2>💬 Chat Realtime</h2>

            <div class="status">
                🟢 Online
            </div>

        </div>

        <div class="acoes">

            <button id="limpar">
                🗑
            </button>

            <button id="trocar">
                👤
            </button>

        </div>

    </div>

    <div id="chat"></div>

    <div class="typing" id="typing"></div>

    <form class="form" id="form">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
        >

        <button type="submit" id="enviar">
            Enviar
        </button>

    </form>

</div>

<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ========================================
// SUPABASE
// ========================================

const supabase = createClient(
    "https://xpfzqbjyizftllasvbll.supabase.co",
    "SUA_SUPABASE_ANON_KEY"
)

// ========================================
// ELEMENTOS
// ========================================

const form =
document.getElementById("form")

const chat =
document.getElementById("chat")

const mensagem =
document.getElementById("mensagem")

const enviarBtn =
document.getElementById("enviar")

const limparBtn =
document.getElementById("limpar")

const trocarBtn =
document.getElementById("trocar")

const typing =
document.getElementById("typing")

// ========================================
// USUARIO
// ========================================

let usuario =
localStorage.getItem("usuario")

if(!usuario){

    usuario =
    prompt("Digite seu nome")

    if(!usuario){

        usuario = "Anônimo"

    }

    localStorage.setItem(
        "usuario",
        usuario
    )

}

// ========================================
// AUTO FOCUS
// ========================================

mensagem.focus()

// ========================================
// CACHE ANTI DUPLICAÇÃO
// ========================================

const ids =
new Set()

// ========================================
// RENDER
// ========================================

function renderMensagem(msg){

    if(ids.has(msg.id)) return

    ids.add(msg.id)

    const div =
    document.createElement("div")

    div.className =
    msg.usuario === usuario
    ? "msg eu"
    : "msg outro"

    const hora =
    new Date(
        msg.created_at
    ).toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
    })

    div.innerHTML = `
        <div class="nome">
            ${msg.usuario}
        </div>

        <div class="texto">
            ${msg.texto}
        </div>

        <div class="hora">
            ${hora}
        </div>
    `

    chat.appendChild(div)

    requestAnimationFrame(()=>{

        chat.scrollTop =
        chat.scrollHeight

    })

}

// ========================================
// HISTÓRICO
// ========================================

async function carregarHistorico(){

    const {
        data,
        error
    } = await supabase
    .from("mensagens")
    .select("*")
    .order("id",{
        ascending:true
    })

    if(error){

        console.error(error)
        return

    }

    chat.innerHTML = ""

    data.forEach(renderMensagem)

}

// ========================================
// ENVIAR
// ========================================

let enviando = false

async function enviarMensagem(){

    if(enviando) return

    const texto =
    mensagem.value.trim()

    if(!texto) return

    enviando = true

    enviarBtn.innerText = "..."

    enviarBtn.classList.add(
        "loading"
    )

    const {
        error
    } = await supabase
    .from("mensagens")
    .insert([
        {
            usuario,
            texto
        }
    ])

    enviando = false

    enviarBtn.innerText =
    "Enviar"

    enviarBtn.classList.remove(
        "loading"
    )

    if(error){

        console.error(error)

        alert(
            "Erro ao enviar"
        )

        return

    }

    mensagem.value = ""

    mensagem.focus()

}

// ========================================
// ENTER FUNCIONANDO
// ========================================

form.addEventListener(
    "submit",

    async e => {

        e.preventDefault()

        await enviarMensagem()

    }

)

// ========================================
// ESC LIMPA INPUT
// ========================================

mensagem.addEventListener(
    "keydown",

    e => {

        if(e.key === "Escape"){

            mensagem.value = ""

        }

    }

)

// ========================================
// TYPING
// ========================================

let timeoutTyping

mensagem.addEventListener(
    "input",

    ()=>{

        typing.innerHTML =
        `${usuario} está digitando...`

        clearTimeout(
            timeoutTyping
        )

        timeoutTyping =
        setTimeout(()=>{

            typing.innerHTML = ""

        },1000)

    }

)

// ========================================
// TROCAR USUARIO
// ========================================

trocarBtn.addEventListener(
    "click",

    ()=>{

        const novo =
        prompt("Novo nome:")

        if(!novo) return

        usuario = novo

        localStorage.setItem(
            "usuario",
            usuario
        )

        alert(
            "Usuário alterado!"
        )

    }

)

// ========================================
// LIMPAR CHAT
// ========================================

limparBtn.addEventListener(
    "click",

    async ()=>{

        const confirmar =
        confirm(
            "Deseja limpar o chat?"
        )

        if(!confirmar) return

        const {
            error
        } = await supabase
        .from("mensagens")
        .delete()
        .neq("id",0)

        if(error){

            console.error(error)
            return

        }

        ids.clear()

        chat.innerHTML = ""

    }

)

// ========================================
// INICIAR
// ========================================

await carregarHistorico()

// ========================================
// REALTIME
// ========================================

supabase

.channel("chat-global")

.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"mensagens"
    },

    payload => {

        renderMensagem(
            payload.new
        )

    }

)

.subscribe(status=>{

    console.log(
        "Realtime:",
        status
    )

})

</script>

</body>
</html>
