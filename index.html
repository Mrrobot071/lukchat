<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat Privado Realtime</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.login{
    width:100%;
    max-width:350px;
    background:#111827;
    border:1px solid #334155;
    padding:30px;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.login input,
.form input{
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#0f172a;
    color:white;
    border:1px solid #334155;
}

.login button,
.form button,
.topo button{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.chat-container{
    width:100%;
    max-width:520px;
    height:95vh;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    display:none;
    flex-direction:column;
    border:1px solid #334155;
}

.topo{
    background:#1e293b;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.online{
    font-size:12px;
    color:#22c55e;
    margin-top:5px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    max-width:80%;
    padding:12px;
    border-radius:15px;
    word-wrap:break-word;
}

.eu{
    background:#2563eb;
    align-self:flex-end;
}

.outro{
    background:#374151;
    align-self:flex-start;
}

.nome{
    font-size:12px;
    opacity:.7;
    margin-bottom:5px;
}

.hora{
    font-size:10px;
    opacity:.5;
    margin-top:5px;
    text-align:right;
}

.form{
    display:flex;
    gap:10px;
    padding:12px;
    background:#1e293b;
}

.form input{
    flex:1;
}
</style>
</head>
<body>

<div class="login" id="loginBox">
    <h2>🔐 Área Privada</h2>
    <input type="password" id="senha" placeholder="Digite a senha">
    <button id="entrarBtn">Entrar</button>
</div>

<div class="chat-container" id="chatContainer">

    <div class="topo">

        <div>
            <h2>💬 Chat Realtime</h2>
            <div class="online" id="statusConexao">
                🟢 Conectado
            </div>
        </div>

        <div style="display:flex; gap:10px;">
            <button id="trocarNomeBtn">👤 Nome</button>
            <button id="limparBtn">🗑️</button>
        </div>

    </div>

    <div id="chat"></div>

    <form class="form" id="form">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
            required
        >

        <button type="submit">
            Enviar
        </button>

    </form>

</div>

<script>
const SENHA = "1libidgel";

const ROOM_ID = "chat_privado_1libidgel";

const WEBSOCKET_URL =
`wss://demo.piesocket.com/v3/${ROOM_ID}?api_key=VCXCEuvhGcBDP7XhiJJUDvR1e1D3wIoc75gB65g4&notify_self=1`;

let socket = null;

const loginBox = document.getElementById("loginBox");
const chatContainer = document.getElementById("chatContainer");
const entrarBtn = document.getElementById("entrarBtn");
const senhaInput = document.getElementById("senha");

const form = document.getElementById("form");
const mensagemInput = document.getElementById("mensagem");
const chat = document.getElementById("chat");

let usuario = localStorage.getItem("usuario");

if(!usuario){
    usuario = "User_" + Math.floor(Math.random()*9999);
    localStorage.setItem("usuario", usuario);
}

document.getElementById("trocarNomeBtn").onclick = () => {

    const novo = prompt("Novo nome:");

    if(novo && novo.trim()){
        usuario = novo.trim();
        localStorage.setItem("usuario", usuario);
    }

};

document.getElementById("limparBtn").onclick = () => {
    chat.innerHTML = "";
};

function atualizarStatus(texto, cor){

    const status = document.getElementById("statusConexao");

    status.innerHTML = texto;
    status.style.color = cor;

}

function entrar(){

    const senha = senhaInput.value.trim();

    if(senha !== SENHA){
        alert("Senha incorreta");
        return;
    }

    loginBox.style.display = "none";
    chatContainer.style.display = "flex";

    conectarSocket();

}

entrarBtn.onclick = entrar;

senhaInput.addEventListener("keydown", e => {

    if(e.key === "Enter"){
        entrar();
    }

});

function conectarSocket(){

    if(socket){
        socket.close();
    }

    socket = new WebSocket(WEBSOCKET_URL);

    socket.onopen = () => {

        atualizarStatus(
            "🟢 Conectado em tempo real",
            "#22c55e"
        );

    };

    socket.onmessage = (event) => {

        try{

            const dados = JSON.parse(event.data);

            if(
                !dados.usuario ||
                !dados.mensagem
            ) return;

            renderizarMensagem(
                dados.usuario,
                dados.mensagem,
                dados.hora
            );

        }catch(err){

            console.log("Mensagem ignorada");

        }

    };

    socket.onerror = () => {

        atualizarStatus(
            "🔴 Erro conexão",
            "#ef4444"
        );

    };

    socket.onclose = () => {

        atualizarStatus(
            "🟠 Reconectando...",
            "#f59e0b"
        );

        setTimeout(() => {

            conectarSocket();

        }, 3000);

    };

}

function renderizarMensagem(nome, mensagem, hora){

    const div = document.createElement("div");

    div.className =
        nome === usuario
        ? "msg eu"
        : "msg outro";

    div.innerHTML = `
        <div class="nome">${nome}</div>
        <div>${mensagem}</div>
        <div class="hora">${hora}</div>
    `;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}

form.addEventListener("submit", (e) => {

    e.preventDefault();

    const texto = mensagemInput.value.trim();

    if(!texto) return;

    if(socket.readyState !== WebSocket.OPEN){

        alert("Sem conexão realtime");
        return;

    }

    const dados = {

        usuario: usuario,
        mensagem: texto,
        hora: new Date().toLocaleTimeString([], {
            hour:"2-digit",
            minute:"2-digit"
        })

    };

    socket.send(JSON.stringify(dados));

    mensagemInput.value = "";

    mensagemInput.focus();

});
</script>

</body>
</html>
