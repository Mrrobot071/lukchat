<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat Realtime Supabase</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    height: 100vh;
    height: 100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    padding: 10px;
}

/* LOGIN */
.login{
    width:100%;
    max-width:350px;
    background:#111827;
    padding:30px;
    border-radius:20px;
    border:1px solid #334155;
    display:flex;
    flex-direction:column;
    gap:15px;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

.login h2{
    text-align:center;
}

.login input{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    border:1px solid #334155;
    font-size: 16px;
}

.login button{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
    font-size: 16px;
}

/* CHAT */
.chat-container{
    width:100%;
    max-width:520px;
    height:95vh;
    height: 95dvh;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    display:none;
    flex-direction:column;
    border:1px solid #334155;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

@media (max-width: 480px) {
    body {
        padding: 0;
    }
    .chat-container {
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        border: none;
    }
}

.topo{
    background:#1e293b;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topo h2{
    font-size:18px;
}

.online{
    font-size:12px;
    color:#22c55e;
    margin-top:5px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    max-width:85%;
    padding:12px;
    border-radius:15px;
    word-wrap:break-word;
}

.eu{
    background:#2563eb;
    align-self:flex-end;
}

.outro{
    background:#374151;
    align-self:flex-start;
}

.nome{
    font-size:12px;
    opacity:.7;
    margin-bottom:5px;
}

.hora{
    font-size:10px;
    opacity:.5;
    margin-top:5px;
    text-align:right;
}

.form{
    display:flex;
    gap:10px;
    padding:12px;
    background:#1e293b;
}

.form input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    font-size: 16px;
}

.form button{
    border:none;
    padding:14px 18px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size: 16px;
}

.botoes{
    display:flex;
    gap:10px;
}

.botoes button{
    border:none;
    background:#334155;
    color:white;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:48px;
}

/* botão do timer com texto pequeno */
#timerMinutos{
    font-size: 11px;
    font-weight: bold;
    color: #38bdf8;
    margin-top: 2px;
}
</style>
</head>
<body>

<div class="login" id="loginBox">
    <h2>🔐 Área Privada</h2>
    <input
        type="password"
        id="senha"
        placeholder="Digite a senha"
    />
    <button id="entrarBtn">Entrar</button>
</div>

<div class="chat-container" id="chatContainer">
    <div class="topo">
        <div>
            <h2>💬 Chat Realtime</h2>
            <div class="online">🟢 Online</div>
        </div>

        <div class="botoes">
            <button id="timerBtn" title="Configurar Temporizador">
                ⏱️ <span id="timerMinutos">Off</span>
            </button>

            <button id="trocarNomeBtn" title="Trocar nome">
                👤
            </button>

            <button id="limparBtn" title="Limpar chat">
                🗑️
            </button>
        </div>
    </div>

    <div id="chat"></div>

    <form class="form" id="form">
        <input
            type="text"
            id="mensagem"
            placeholder="Digite..."
            autocomplete="off"
            required
        />
        <button type="submit">➤</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// CONFIG
const SENHA = "a1234";

const SUPABASE_URL = "https://xpfzqbjyizftllasvbll.supabase.co";
const SUPABASE_KEY = "sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ELEMENTOS
const loginBox = document.getElementById("loginBox");
const chatContainer = document.getElementById("chatContainer");
const entrarBtn = document.getElementById("entrarBtn");
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const mensagemInput = document.getElementById("mensagem");
const timerBtn = document.getElementById("timerBtn");
const timerMinutos = document.getElementById("timerMinutos");
const trocarNomeBtn = document.getElementById("trocarNomeBtn");
const limparBtn = document.getElementById("limparBtn");

// CONTROLE
let ultimaMensagemId = 0;
let usuario = "";
let intervaloLimpeza = null;
let chatIniciado = false;

// LOGIN
entrarBtn.onclick = entrar;

function entrar(){
    const senha = document.getElementById("senha").value;

    if(senha !== SENHA){
        alert("Senha incorreta");
        return;
    }

    loginBox.style.display = "none";
    chatContainer.style.display = "flex";
    iniciarChat();
}

// CHAT
async function iniciarChat(){
    if(chatIniciado) return;
    chatIniciado = true;

    usuario = localStorage.getItem("usuario");

    if(!usuario){
        usuario = prompt("Seu nome?");

        if(!usuario){
            usuario = "Anônimo";
        }

        localStorage.setItem("usuario", usuario);
    }

    // TROCAR NOME
    trocarNomeBtn.onclick = () => {
        const novo = prompt("Novo nome:");

        if(novo){
            usuario = novo;
            localStorage.setItem("usuario", usuario);
        }
    };

    // LIMPAR CHAT VISUAL
    limparBtn.onclick = () => {
        chat.innerHTML = "";
    };

    // TEMPORIZADOR EDITÁVEL PELO CHAT
    timerBtn.onclick = () => {
        const inputTempo = prompt(
            "Defina o tempo para limpeza automática (em minutos) ou digite 0 para desligar:"
        );

        if (inputTempo === null) {
            return;
        }

        const minutos = parseInt(inputTempo);
        const chatElemento = document.getElementById("chat");

        if (intervaloLimpeza) {
            clearInterval(intervaloLimpeza);
            intervaloLimpeza = null;
        }

        if (!isNaN(minutos) && minutos > 0) {
            timerMinutos.innerText = minutos + "m";

            intervaloLimpeza = setInterval(() => {
                if (chatElemento) {
                    chatElemento.innerHTML = "";
                    console.log(`Chat limpo automaticamente (Ciclo de ${minutos} min).`);
                }
            }, minutos * 60 * 1000);

            alert(`Temporizador ativado! O chat será limpo a cada ${minutos} minuto(s).`);
        } else {
            timerMinutos.innerText = "Off";
            alert("Temporizador desligado.");
        }
    };

    // RENDER
    function renderMensagem(msg){
        if (document.getElementById("msg-" + msg.id)) {
            return;
        }

        const div = document.createElement("div");
        div.id = "msg-" + msg.id;

        const eu = msg.usuario === usuario;
        div.className = "msg " + (eu ? "eu" : "outro");

        const hora = new Date(msg.criado_em).toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });

        div.innerHTML = `
            <div class="nome">${msg.usuario}</div>
            <div>${msg.texto}</div>
            <div class="hora">${hora}</div>
        `;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // CARREGAR TODAS
    async function carregarMensagens(){
        const { data, error } = await supabaseClient
            .from("mensagens")
            .select("*")
            .order("id",{ ascending:true });

        if(error){
            console.log(error);
            return;
        }

        chat.innerHTML = "";

        data.forEach(msg => {
            renderMensagem(msg);

            if(msg.id > ultimaMensagemId){
                ultimaMensagemId = msg.id;
            }
        });
    }

    // BUSCAR NOVAS
    async function buscarNovasMensagens(){
        const { data, error } = await supabaseClient
            .from("mensagens")
            .select("*")
            .gt("id", ultimaMensagemId)
            .order("id",{ ascending:true });

        if(error){
            console.log(error);
            return;
        }

        data.forEach(msg => {
            renderMensagem(msg);
            ultimaMensagemId = msg.id;
        });
    }

    // HISTÓRICO
    await carregarMensagens();

    // REALTIME
    supabaseClient
        .channel("chat-global")
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"mensagens"
            },
            payload => {
                if(payload.new.id > ultimaMensagemId){
                    renderMensagem(payload.new);
                    ultimaMensagemId = payload.new.id;
                }
            }
        )
        .subscribe(status => {
            console.log("Realtime:", status);
        });

    // ATUALIZAÇÃO A CADA 1 SEGUNDO
    setInterval(() => {
        buscarNovasMensagens();
    },1000);

    // ENVIAR
    form.addEventListener("submit", async e => {
        e.preventDefault();

        const texto = mensagemInput.value.trim();
        if(!texto) return;

        const { error } = await supabaseClient
            .from("mensagens")
            .insert([{
                usuario,
                texto
            }]);

        if(error){
            console.log(error);
            alert("Erro ao enviar");
            return;
        }

        mensagemInput.value = "";
        mensagemInput.focus();
    });
}
</script>

</body>
</html>
