<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    height: 100vh;
    height: 100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    padding: 10px;
}

/* LOGIN */
.login{
    width:100%;
    max-width:350px;
    background:#111827;
    padding:30px;
    border-radius:20px;
    border:1px solid #334155;
    display:flex;
    flex-direction:column;
    gap:15px;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

.login h2{
    text-align:center;
}

.login input{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    border:1px solid #334155;
    font-size: 16px;
}

.login button{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
    font-size: 16px;
}

/* CHAT */
.chat-container{
    width:100%;
    max-width:520px;
    height:95vh;
    height: 95dvh;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    display:none;
    flex-direction:column;
    border:1px solid #334155;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

@media (max-width: 480px) {
    body {
        padding: 0;
    }
    .chat-container {
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        border: none;
    }
}

.topo{
    background:#1e293b;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topo h2{
    font-size:18px;
}

.online{
    font-size:12px;
    color:#22c55e;
    margin-top:5px;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    max-width:85%;
    padding:12px;
    border-radius:15px;
    word-wrap:break-word;
}

.eu{
    background:#2563eb;
    align-self:flex-end;
}

.outro{
    background:#374151;
    align-self:flex-start;
}

.nome{
    font-size:12px;
    opacity:.7;
    margin-bottom:5px;
}

.hora{
    font-size:10px;
    opacity:.5;
    margin-top:5px;
    text-align:right;
}

.form{
    display:flex;
    gap:10px;
    padding:12px;
    background:#1e293b;
}

.form input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#0f172a;
    color:white;
    outline:none;
    font-size: 16px;
}

.form button{
    border:none;
    padding:14px 18px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size: 16px;
}

.botoes{
    display:flex;
    gap:10px;
}

.botoes button{
    border:none;
    background:#334155;
    color:white;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:48px;
}

/* botão do timer com texto pequeno */
#timerMinutos{
    font-size: 11px;
    font-weight: bold;
    color: #38bdf8;
    margin-top: 2px;
}
</style>
</head>
<body>

<div class="login" id="loginBox">
    <h2>🔐 Área Privada</h2>
    <input
        type="password"
        id="senha"
        placeholder="Digite a senha"
    />
    <button id="entrarBtn">Entrar</button>
</div>

<div class="chat-container" id="chatContainer">
    <div class="topo">
        <div>
            <h2>💬 Chat Realtime</h2>
            <div class="online">🟢 Online</div>
        </div>

        <div class="botoes">
            <button id="timerBtn" title="Configurar Temporizador">
                ⏱️ <span id="timerMinutos">Off</span>
            </button>

            <button id="trocarNomeBtn" title="Trocar nome">
                👤
            </button>

            <button id="limparBtn" title="Limpar chat">
                🗑️
            </button>
        </div>
    </div>

    <div id="chat"></div>

    <form class="form" id="form">
        <input
            type="text"
            id="mensagem"
            placeholder="Digite..."
            autocomplete="off"
            required
        />
        <button type="submit">➤</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ======================================
// CONFIG
// ======================================

const SENHA = "a1234";

const TEMPO_LOGIN =
6 * 60 * 60 * 1000;
// 6 horas

const SUPABASE_URL =
"https://xpfzqbjyizftllasvbll.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uBA1jMvY7JwZhqEkUpMRlg_W_HBwEZU";

// ======================================
// SUPABASE
// ======================================

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ======================================
// ELEMENTOS
// ======================================

const loginBox =
document.getElementById("loginBox");

const chatContainer =
document.getElementById("chatContainer");

const entrarBtn =
document.getElementById("entrarBtn");

const senhaInput =
document.getElementById("senha");

const form =
document.getElementById("form");

const mensagemInput =
document.getElementById("mensagem");

const chat =
document.getElementById("chat");

const limparBtn =
document.getElementById("limparBtn");

const trocarNomeBtn =
document.getElementById("trocarNomeBtn");

const timerBtn =
document.getElementById("timerBtn");

const timerMinutos =
document.getElementById("timerMinutos");

// ======================================
// CONTROLE
// ======================================

let usuario = "";

let intervaloLimpeza = null;

let chatIniciado = false;

// ======================================
// VERIFICAR LOGIN CACHE
// ======================================

verificarLoginCache();

// ======================================
// EVENTOS LOGIN
// ======================================

entrarBtn.addEventListener(
    "click",
    entrar
);

senhaInput.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            entrar();
        }
    }
);

// ======================================
// VERIFICAR CACHE
// ======================================

function verificarLoginCache(){

    const loginSalvo =
    localStorage.getItem(
        "chat_login"
    );

    const timestamp =
    localStorage.getItem(
        "chat_login_time"
    );

    if(
        !loginSalvo
        ||
        !timestamp
    ){
        return;
    }

    const agora =
    Date.now();

    const diferenca =
    agora - Number(timestamp);

    if(
        diferenca <
        TEMPO_LOGIN
    ){

        liberarChat();

    }else{

        localStorage.removeItem(
            "chat_login"
        );

        localStorage.removeItem(
            "chat_login_time"
        );
    }
}

// ======================================
// LOGIN
// ======================================

function entrar(){

    const senha =
    senhaInput.value.trim();

    if(senha !== SENHA){

        alert(
            "Senha incorreta"
        );

        return;
    }

    localStorage.setItem(
        "chat_login",
        "true"
    );

    localStorage.setItem(
        "chat_login_time",
        Date.now()
    );

    liberarChat();
}

// ======================================
// LIBERAR CHAT
// ======================================

function liberarChat(){

    loginBox.style.display =
    "none";

    chatContainer.style.display =
    "flex";

    iniciarChat();
}

// ======================================
// LOGOUT
// ======================================

function logout(){

    localStorage.removeItem(
        "chat_login"
    );

    localStorage.removeItem(
        "chat_login_time"
    );

    location.reload();
}

// ======================================
// INICIAR CHAT
// ======================================

async function iniciarChat(){

    if(chatIniciado) return;

    chatIniciado = true;

    usuario =
    localStorage.getItem(
        "usuario"
    );

    if(!usuario){

        usuario =
        prompt("Seu nome?");

        if(!usuario){

            usuario =
            "Anônimo";
        }

        localStorage.setItem(
            "usuario",
            usuario
        );
    }

    // ======================================
    // TROCAR NOME
    // ======================================

    trocarNomeBtn.onclick =
    () => {

        const novo =
        prompt("Novo nome:");

        if(!novo) return;

        usuario = novo;

        localStorage.setItem(
            "usuario",
            usuario
        );
    };

    // ======================================
    // LIMPAR CHAT
    // ======================================

    limparBtn.onclick =
    async () => {

        const ok =
        confirm(
            "Apagar todas mensagens?"
        );

        if(!ok) return;

        const { error } =
        await supabaseClient

        .from("mensagens")

        .delete()

        .not(
            "id",
            "is",
            null
        );

        if(error){

            console.log(error);

            alert(
                "Erro ao limpar"
            );

            return;
        }

        await carregarMensagens();
    };

    // ======================================
    // TIMER
    // ======================================

    timerBtn.onclick =
    () => {

        const valor =
        prompt(
            "Tempo em minutos:"
        );

        if(valor === null)
        return;

        const minutos =
        parseInt(valor);

        clearInterval(
            intervaloLimpeza
        );

        intervaloLimpeza =
        null;

        if(
            isNaN(minutos)
            ||
            minutos <= 0
        ){

            timerMinutos.innerText =
            "Off";

            alert(
                "Temporizador desligado"
            );

            return;
        }

        timerMinutos.innerText =
        minutos + "m";

        intervaloLimpeza =
        setInterval(
        async () => {

            const { error } =
            await supabaseClient

            .from("mensagens")

            .delete()

            .not(
                "id",
                "is",
                null
            );

            if(error){

                console.log(error);

                return;
            }

            await carregarMensagens();

        }, minutos * 60000);

        alert(
            `Limpeza automática: ${minutos} min`
        );
    };

    // ======================================
    // LOAD INICIAL
    // ======================================

    await carregarMensagens();

    // ======================================
    // REALTIME
    // ======================================

    supabaseClient

    .channel("chat-global")

    .on(
        "postgres_changes",

        {
            event:"*",
            schema:"public",
            table:"mensagens"
        },

        async payload => {

            console.log(payload);

            await carregarMensagens();
        }
    )

    .subscribe(status => {

        console.log(
            "Realtime:",
            status
        );
    });
}

// ======================================
// CARREGAR MSG
// ======================================

async function carregarMensagens(){

    const { data, error } =

    await supabaseClient

    .from("mensagens")

    .select("*")

    .order(
        "criado_em",
        {
            ascending:true
        }
    );

    if(error){

        console.log(error);

        return;
    }

    chat.innerHTML = "";

    data.forEach(msg => {

        const div =
        document.createElement("div");

        div.className =
        "msg " +

        (
            msg.usuario === usuario
            ? "eu"
            : "outro"
        );

        const hora =
        new Date(
            msg.criado_em
        )

        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

        div.innerHTML = `

            <div class="nome">
                ${msg.usuario}
            </div>

            <div>
                ${msg.texto}
            </div>

            <div class="hora">
                ${hora}
            </div>

        `;

        chat.appendChild(div);
    });

    chat.scrollTop =
    chat.scrollHeight;
}

// ======================================
// ENVIAR MSG
// ======================================

form.addEventListener(

    "submit",

    async e => {

        e.preventDefault();

        const texto =
        mensagemInput.value.trim();

        if(!texto) return;

        mensagemInput.disabled =
        true;

        const { error } =

        await supabaseClient

        .from("mensagens")

        .insert([
            {
                usuario,
                texto
            }
        ]);

        mensagemInput.disabled =
        false;

        if(error){

            console.log(error);

            alert(
                "Erro ao enviar"
            );

            return;
        }

        mensagemInput.value = "";

        mensagemInput.focus();

        await carregarMensagens();
    }
);

</script>

</body>
</html>
