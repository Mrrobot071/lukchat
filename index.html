<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Realtime PRO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:
    linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
    );

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
}

.chat-container{
    width:100%;
    max-width:500px;
    height:95vh;
    background:#1e293b;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    border:1px solid #334155;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

.topo{
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #334155;
}

.topo-esquerda{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.topo h2{
    font-size:18px;
}

.status{
    font-size:12px;
    color:#22c55e;
}

.acoes{
    display:flex;
    gap:10px;
}

button{
    border:none;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

#trocarBtn{
    background:#ef4444;
}

#limparBtn{
    background:#f59e0b;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:12px;
    scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
    width:6px;
}

#chat::-webkit-scrollbar-thumb{
    background:#475569;
    border-radius:10px;
}

.msg{
    padding:12px 16px;
    border-radius:16px;
    max-width:80%;
    word-wrap:break-word;
    animation:aparecer .2s ease;
}

.eu{
    background:#2563eb;
    align-self:flex-end;
}

.outro{
    background:#374151;
    align-self:flex-start;
}

.nome{
    font-size:12px;
    opacity:.7;
    margin-bottom:5px;
}

.texto{
    font-size:15px;
    line-height:1.4;
}

.hora{
    font-size:10px;
    opacity:.5;
    margin-top:6px;
    text-align:right;
}

.form{
    display:flex;
    gap:10px;
    padding:12px;
    background:#111827;
    border-top:1px solid #334155;
}

.form input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#1e293b;
    color:white;
    border:1px solid #334155;
    transition:.2s;
}

.form input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.2);
}

.form button{
    background:#2563eb;
}

.form button:hover{
    background:#3b82f6;
}

.typing{
    padding:0 15px 10px;
    font-size:12px;
    opacity:.7;
    color:#94a3b8;
}

@keyframes aparecer{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media(max-width:600px){

    .chat-container{
        width:100%;
        height:100vh;
        max-width:100%;
        border-radius:0;
    }

}

</style>

</head>
<body>

<div class="chat-container">

    <div class="topo">

        <div class="topo-esquerda">

            <h2>💬 Chat Online</h2>

            <div class="status">
                🟢 Online em tempo real
            </div>

        </div>

        <div class="acoes">

            <button id="limparBtn">
                🗑
            </button>

            <button id="trocarBtn">
                👤
            </button>

        </div>

    </div>

    <div id="chat"></div>

    <div class="typing" id="typing"></div>

    <div class="form">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
        >

        <button id="enviarBtn">
            Enviar
        </button>

    </div>

</div>

<script type="module">

import {
    createClient
} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// ======================================
// SUPABASE
// ======================================

const supabase = createClient(
    'https://xpfzqbjyizftllasvbll.supabase.co',
    'SUA_KEY_AQUI'
)

// ======================================
// ELEMENTOS
// ======================================

const chat = document.getElementById("chat")
const mensagem = document.getElementById("mensagem")
const enviarBtn = document.getElementById("enviarBtn")
const limparBtn = document.getElementById("limparBtn")
const trocarBtn = document.getElementById("trocarBtn")
const typing = document.getElementById("typing")

// ======================================
// USUARIO
// ======================================

let usuario = localStorage.getItem("usuario")

if(!usuario){

    usuario = prompt("Digite seu nome")

    if(!usuario){

        usuario = "Anônimo"

    }

    localStorage.setItem(
        "usuario",
        usuario
    )

}

// ======================================
// AUTO FOCUS
// ======================================

mensagem.focus()

// ======================================
// CACHE
// ======================================

const mensagensRenderizadas = new Set()

// ======================================
// RENDER
// ======================================

function renderMensagem(msg){

    if(
        mensagensRenderizadas.has(msg.id)
    ) return

    mensagensRenderizadas.add(msg.id)

    const div = document.createElement("div")

    div.className =
        msg.usuario === usuario
        ? "msg eu"
        : "msg outro"

    const hora = new Date(
        msg.created_at
    ).toLocaleTimeString([], {
        hour:"2-digit",
        minute:"2-digit"
    })

    div.innerHTML = `
        <div class="nome">
            ${msg.usuario}
        </div>

        <div class="texto">
            ${msg.texto}
        </div>

        <div class="hora">
            ${hora}
        </div>
    `

    chat.appendChild(div)

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight

    })

}

// ======================================
// HISTORICO
// ======================================

async function carregar(){

    const { data, error } =
    await supabase
        .from("mensagens")
        .select("*")
        .order("id", {
            ascending:true
        })

    if(error){

        console.error(error)
        return

    }

    chat.innerHTML = ""

    data.forEach(renderMensagem)

}

carregar()

// ======================================
// ANTI SPAM
// ======================================

let ultimoEnvio = 0

// ======================================
// ENVIAR
// ======================================

async function enviar(){

    const texto =
        mensagem.value.trim()

    if(!texto) return

    if(
        Date.now() - ultimoEnvio < 800
    ){

        return

    }

    ultimoEnvio = Date.now()

    enviarBtn.disabled = true
    enviarBtn.innerText = "..."

    const { error } =
    await supabase
        .from("mensagens")
        .insert([
            {
                usuario,
                texto
            }
        ])

    enviarBtn.disabled = false
    enviarBtn.innerText = "Enviar"

    if(error){

        console.error(error)
        alert("Erro ao enviar")
        return

    }

    mensagem.value = ""
    mensagem.focus()

}

// ======================================
// EVENTOS
// ======================================

enviarBtn.addEventListener(
    "click",
    enviar
)

mensagem.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            enviar()

        }

        if(e.key === "Escape"){

            mensagem.value = ""

        }

    }
)

// ======================================
// TROCAR USUARIO
// ======================================

trocarBtn.addEventListener(
    "click",
    () => {

        const novo =
            prompt("Novo nome:")

        if(!novo) return

        usuario = novo

        localStorage.setItem(
            "usuario",
            usuario
        )

        alert("Usuário alterado!")

    }
)

// ======================================
// REALTIME
// ======================================

supabase
.channel("chat-global")

.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"mensagens"
    },

    payload => {

        renderMensagem(
            payload.new
        )

    }
)

.subscribe(status => {

    console.log(
        "REALTIME:",
        status
    )

})

// ======================================
// LIMPAR
// ======================================

limparBtn.addEventListener(
    "click",

    async () => {

        const confirmar =
        confirm(
            "Deseja limpar o chat?"
        )

        if(!confirmar) return

        const { error } =
        await supabase
            .from("mensagens")
            .delete()
            .neq("id", 0)

        if(error){

            console.error(error)
            return

        }

        mensagensRenderizadas.clear()

        chat.innerHTML = ""

    }

)

// ======================================
// TYPING
// ======================================

let timeoutTyping

mensagem.addEventListener(
    "input",

    () => {

        typing.innerHTML =
            `${usuario} está digitando...`

        clearTimeout(timeoutTyping)

        timeoutTyping =
        setTimeout(() => {

            typing.innerHTML = ""

        }, 1000)

    }

)

</script>

</body>
</html>
